// ── ТОГТМОЛ ЗААЛТЫН БИЕЛЭЛТИЙН МӨЧЛӨГ (7 хоног/сар/улирал тутам хэдэн удаа биелэгдсэнийг түүхчилж хадгална) ──
var RECUR_CYCLES_PER_YEAR={weekly:52,monthly:12,quarterly:4,semiannual:2,annual:1};
function expectedCyclesPerYear(it){
  if(it.recurPattern&&it.recurPattern.type&&RECUR_CYCLES_PER_YEAR[it.recurPattern.type])return RECUR_CYCLES_PER_YEAR[it.recurPattern.type];
  var t=(it.dueDate||'')+' '+(it.recurring?'тогтмол':'');
  if(/7 хоног|долоо хоног|долоо хоногт/i.test(t))return 52;
  if(/сар бүр|сар тутам/i.test(t))return 12;
  if(/улирал/i.test(t))return 4;
  if(/хагас жил/i.test(t))return 2;
  if(/жил бүр|жилдээ|жил тутам/i.test(t))return 1;
  return null;
}
function fulfillmentCycleCountDone(it){
  var hist=(it.fulfillmentHistory||[]).filter(function(h){return h.status==='approved';}).length;
  if(it.reportStatus==='approved')hist++;
  return hist;
}
// Тогтмол заалтын давтамжийн төрлийг тодорхойлно (7 хоног бүр/сар бүр/улирал бүр/хагас жил тутам/жил бүр) —
// Төлөвлөгөөний хяналт хэсгийн "Давтамж" шүүлтүүрт ашиглагдана. Тогтмол биш заалтад null буцаана. Тогтмол ч
// боловч дээрх аль ч нэрлэсэн давтамжид тохироогүй бол (жиш. dueDate хоосон) 'other' буцаана.
function itemRecurFreqType(it){
  if(!it.recurring)return null;
  if(it.recurPattern&&it.recurPattern.type&&RECUR_CYCLES_PER_YEAR[it.recurPattern.type])return it.recurPattern.type;
  var t=it.dueDate||'';
  if(/7 хоног|долоо хоног/i.test(t))return 'weekly';
  if(/сар бүр|сар тутам/i.test(t))return 'monthly';
  if(/улирал/i.test(t))return 'quarterly';
  if(/хагас жил/i.test(t))return 'semiannual';
  if(/жил бүр|жилдээ|жил тутам/i.test(t))return 'annual';
  return 'other';
}

function distinctDocCount(items){

    set[key]=true;
  });

function buildAttentionInsights(){
  var items=getAllWorkItems();
  var today=new Date();today.setHours(0,0,0,0);
  var insights=[];
  var overdueItems=items.filter(function(it){return it.dueDate&&!it.done&&isIsoDate(it.dueDate)&&new Date(it.dueDate)<today;});
  if(overdueItems.length)insights.push({sev:'high',icon:'ti-alert-triangle',text:overdueItems.length+' заалт хугацаа хэтэрсэн ч дуусаагүй байна'});
  var unassignedItems=items.filter(function(it){return !it.staffId&&!it.dept;});
  if(unassignedItems.length)insights.push({sev:'medium',icon:'ti-user-question',text:unassignedItems.length+' заалт хариуцагч оноогдоогүй байна'});
  var deptOrder=['ДХХ','ТДАХ','ЦБДШХ','САА'];
  var deptStatsAll=deptOrder.map(function(d){
    var arr=items.filter(function(it){return it.dept===d;});
    var dn=arr.filter(function(it){return it.done;}).length;
    return {dept:d,total:arr.length,done:dn,pct:arr.length?Math.round(dn/arr.length*100):0};
  }).filter(function(s){return s.total>0;});
  var worstDept=deptStatsAll.slice().sort(function(a,b){return a.pct-b.pct;})[0];
  if(worstDept&&worstDept.pct<50)insights.push({sev:'medium',icon:'ti-building-warehouse',text:(DEPT_NAMES[worstDept.dept]||worstDept.dept)+' хамгийн бага гүйцэтгэлтэй байна ('+worstDept.pct+'%)'});
  var staleMs=3*24*3600*1000;
  var staleReviews=items.filter(function(it){return it.reportStatus==='submitted'&&it.reportSubmittedAt&&(Date.now()-new Date(it.reportSubmittedAt).getTime())>staleMs;});
  if(staleReviews.length)insights.push({sev:'high',icon:'ti-clock-exclamation',text:staleReviews.length+' илгээсэн биелэлт 3-аас дээш хоног хэлтсийн даргаар хянагдаагүй байна'});
  var returnedStale=items.filter(function(it){return it.reportStatus==='returned';});
  if(returnedStale.length)insights.push({sev:'medium',icon:'ti-corner-up-left',text:returnedStale.length+' биелэлт алба хаагчид буцаагдсан ч дахин илгээгдээгүй байна'});
  var ws=weekStartOf(todayStr());
  var staffAll=(S.data.staff||STAFF_LIST).filter(function(s){return s.assignable;});
  var pendingWeekly=staffAll.filter(function(s){return !currentWeeklyReport(s.id,ws);}).length;
  if(pendingWeekly)insights.push({sev:pendingWeekly>staffAll.length*0.5?'high':'medium',icon:'ti-calendar-off',text:pendingWeekly+' алба хаагч энэ 7 хоногийн тайлангаа ирүүлээгүй байна'});
  if(!insights.length)insights.push({sev:'good',icon:'ti-circle-check',text:'Одоогоор анхаарал татах томоохон асуудал алга байна'});
  var sevOrder={high:0,medium:1,good:2};
  insights.sort(function(a,b){return sevOrder[a.sev]-sevOrder[b.sev];});
  return insights;
}

  }).join('');

  return '<div class="page"><div class="page-hd"><div><h2>Дүгнэлт</h2></div></div>'
    +'<div class="card" style="margin-bottom:20px"><div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">'
    +donutHtml(pct,'#34d399',150,pct+'%','Биелсэн ('+done+'/'+total+')')

function getDataBackupInfo(){
  try{
    var raw=localStorage.getItem('ajl_data_backup');
    if(!raw)return null;
    var b=JSON.parse(raw);
    if(!b||!b.savedAt)return null;
    return {whenLabel:new Date(b.savedAt).toLocaleString('mn-MN')};
  }catch(e){return null;}
}
function saveDataBackup(){
  try{localStorage.setItem('ajl_data_backup', JSON.stringify({savedAt:new Date().toISOString(),data:S.data,planTrack:S.planTrack},stripDataUrlReplacer));}catch(e){}
}
function restoreDataBackup(){
  var bk=getDataBackupInfo();
  if(!bk){showToast('Нөөц олдсонгүй','#fbbf24');return;}
  if(!confirm('Сүүлийн нөөц ('+bk.whenLabel+') рүү буцаах уу? Одоогийн өгөгдөл нөөцөөр солигдоно.'))return;
  try{
    var raw=JSON.parse(localStorage.getItem('ajl_data_backup'));
    localStorage.setItem('ajl_data', JSON.stringify(raw.data));
    if(raw.planTrack)localStorage.setItem('ajl_plantrack', JSON.stringify(raw.planTrack));
    showToast('Нөөцөөс сэргээгдлээ — дахин ачаалж байна...','#059669');
    setTimeout(function(){location.reload();},600);
  }catch(e){showToast('Сэргээхэд алдаа гарлаа','#fb7185');}
}

function saveStaffForm(){
  var name=document.getElementById('sf_name').value.trim();

  var rec={
    name:name,
    rank:document.getElementById('sf_rank').value.trim(),
    position:document.getElementById('sf_position').value.trim(),
    dept:document.getElementById('sf_dept').value,
    duty:document.getElementById('sf_duty').value.trim(),
    assignable:document.getElementById('sf_assignable').value==='true'
  };
  var _pinVal=document.getElementById('sf_pin').value.trim();
  if(_pinVal)rec.pin=_pinVal;
  var _rrEl=document.getElementById('sf_reportrole');
  rec.reportRole=_rrEl?_rrEl.value:'';
  var _adminEl=document.getElementById('sf_isadmin'), _dhEl=document.getElementById('sf_isdepthead');
  rec.isAdmin=_adminEl?_adminEl.checked:false;
  rec.isDeptHead=_dhEl?_dhEl.checked:false;

  if(S.staffEditId){
    var idx=S.data.staff.findIndex(function(x){return x.id===S.staffEditId;});
    if(idx!==-1)S.data.staff[idx]=Object.assign({},S.data.staff[idx],rec);
  } else {
    var maxId=S.data.staff.reduce(function(m,x){return Math.max(m,x.id);},0);

function sendFeedbackRequest(letterId){
  var letter=findLetter(letterId);if(!letter)return;
  var f=S.feedbackForm||{};
  var deadlineEl=document.getElementById('fb-deadline-'+letterId);
  var deadline=deadlineEl?deadlineEl.value:(f.deadline||'');
  var staffList=(S.data.staff||STAFF_LIST).filter(function(s){return s.assignable;});
  var targetIds=[];
  if(f.all){
    targetIds=staffList.map(function(s){return s.id;});
  } else {
    targetIds=(f.staffIds||[]).slice();
    (f.depts||[]).forEach(function(d){ staffList.filter(function(s){return s.dept===d;}).forEach(function(s){ if(targetIds.indexOf(s.id)===-1)targetIds.push(s.id); }); });
  }
  if(!targetIds.length){showToast('Хүлээн авагч сонгоогүй байна','#fbbf24');return;}
  letter.feedbackReq={id:genId(),targetStaffIds:targetIds,deadline:deadline||'',sentAt:new Date().toISOString(),sentBy:S.currentUser,responses:{}};
  S.feedbackForm={};
  saveData();showToast(targetIds.length+' хүнд санал асуух хүсэлт илгээгдлээ ✓','#059669');render();
}
function cancelFeedbackRequest(letterId){
  var letter=findLetter(letterId);if(!letter)return;
  if(!confirm('Санал асуусан хүсэлтийг цуцлах уу? Ирсэн хариунууд устана.'))return;
  letter.feedbackReq=null;saveData();render();
}

// ── ЕРӨНХИЙ ХУУДАСЛАЛТ (pagination) — урт жагсаалтуудыг 5/10/15/20-аар (эсвэл бүгд) хуудаслаж харуулна ──
// Хуудасны төлөв (S.pgSize/S.pgNum) зөвхөн UI-ийн түр төлөв тул saveData()-д огт хамааралгүй (session-only) —
// key нь тухайн жагсаалтыг өвөрмөгөөр ялгах мөр (жиш нь 'list_letters_in', 'recurring', 'sendmon', 'archive').
function pgSize(key){ var v=S.pgSize&&S.pgSize[key]; return v||10; }
function pgNum(key){ return (S.pgNum&&S.pgNum[key])||1; }
function setPgSize(key,val){
  S.pgSize=S.pgSize||{}; S.pgSize[key]=(val==='all')?'all':(parseInt(val,10)||10);
  S.pgNum=S.pgNum||{}; S.pgNum[key]=1;
  render();
}
function setPgNum(key,n){ S.pgNum=S.pgNum||{}; S.pgNum[key]=n; render(); }
function paginate(arr,key){
  var size=pgSize(key);
  if(size==='all')return {page:arr,pageNum:1,totalPages:1,size:'all',total:arr.length};
  var totalPages=Math.max(1,Math.ceil(arr.length/size));
  var num=Math.min(Math.max(1,pgNum(key)),totalPages);
  var start=(num-1)*size;
  return {page:arr.slice(start,start+size),pageNum:num,totalPages:totalPages,size:size,total:arr.length};
}
function paginationBarHtml(key,res){
  if(res.total<=5)return '';
  var sizes=[5,10,15,20];
  var sizeSel='<select onchange="setPgSize('+jsq(key)+',this.value)" style="font-size:11.5px;padding:4px 8px;border-radius:6px;border:.5px solid #26395a;background:#0d1626;color:#E7EDF7">'
    +sizes.map(function(s){return '<option value="'+s+'"'+(res.size===s?' selected':'')+'>'+s+'-аар</option>';}).join('')
    +'<option value="all"'+(res.size==='all'?' selected':'')+'>Бүгд</option>'
    +'</select>';
  var nav='';
  if(res.totalPages>1){
    var btns='';
    for(var p=1;p<=res.totalPages;p++){
      if(res.totalPages>7&&p!==1&&p!==res.totalPages&&Math.abs(p-res.pageNum)>1){
        if(p===2||p===res.totalPages-1)btns+='<span style="padding:0 4px;color:#5f7292">…</span>';
        continue;
      }
      btns+='<button onclick="setPgNum('+jsq(key)+','+p+')" style="min-width:26px;padding:4px 6px;font-size:11.5px;border-radius:6px;border:.5px solid '+(p===res.pageNum?'#3B82F6':'#26395a')+';background:'+(p===res.pageNum?'#1d3a63':'transparent')+';color:'+(p===res.pageNum?'#fff':'#8aaace')+';cursor:pointer;margin:0 1px">'+p+'</button>';
    }
    nav='<div style="display:flex;align-items:center;gap:2px">'
      +'<button onclick="setPgNum('+jsq(key)+','+Math.max(1,res.pageNum-1)+')"'+(res.pageNum<=1?' disabled':'')+' style="padding:4px 8px;font-size:12px;border-radius:6px;border:.5px solid #26395a;background:transparent;color:#8aaace;cursor:pointer">‹</button>'
      +btns
      +'<button onclick="setPgNum('+jsq(key)+','+Math.min(res.totalPages,res.pageNum+1)+')"'+(res.pageNum>=res.totalPages?' disabled':'')+' style="padding:4px 8px;font-size:12px;border-radius:6px;border:.5px solid #26395a;background:transparent;color:#8aaace;cursor:pointer">›</button>'
      +'</div>';
  }
  var fromN=res.total?((res.pageNum-1)*(res.size==='all'?res.total:res.size)+1):0;
  var toN=res.size==='all'?res.total:Math.min(res.pageNum*res.size,res.total);
  var info='<span style="font-size:11.5px;color:#5f7292">Нийт '+res.total+' — '+(res.size==='all'?'бүгдийг харуулж байна':(fromN+'–'+toN))+'</span>';
  return '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0;padding:8px 10px;background:#0d1626;border-radius:8px">'
    +'<div>'+info+'</div>'
    +'<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+sizeSel+nav+'</div>'
    +'</div>';
}
function calcNextDue(r){
  const t=new Date();t.setHours(0,0,0,0);
  if(r.type==='weekly'){const td=parseInt(r.dayOfWeek)||1,cd=t.getDay()===0?7:t.getDay();let d=(td-cd+7)%7;if(d===0)d=7;const n=new Date(t);n.setDate(n.getDate()+d);return n;}
  if(r.type==='monthly'){const day=parseInt(r.dayOfMonth)||25;let n=new Date(t.getFullYear(),t.getMonth(),day);if(n<=t)n=new Date(t.getFullYear(),t.getMonth()+1,day);return n;}
  if(r.type==='quarterly'){const day=parseInt(r.dayOfMonth)||25,qm=[2,5,8,11];for(let i=0;i<8;i++){const n=new Date(t.getFullYear()+Math.floor(i/4),qm[i%4],day);if(n>t)return n;}}
  if(r.type==='semiannual'){const day=parseInt(r.dayOfMonth)||25,sm=[5,11];for(let i=0;i<6;i++){const n=new Date(t.getFullYear()+Math.floor(i/2),sm[i%2],day);if(n>t)return n;}}
  if(r.type==='annual'){const day=parseInt(r.dayOfMonth)||25,m=parseInt(r.month)||11;let n=new Date(t.getFullYear(),m,day);if(n<=t)n=new Date(t.getFullYear()+1,m,day);return n;}
  return null;
}
function recurLabel(r){
  if(!r)return'';
  if(r.type==='weekly')return'7 хоног бүрийн '+WEEKDAYS[(parseInt(r.dayOfWeek)||1)-1]+' гараг';
  if(r.type==='monthly')return'Сар бүрийн '+(r.dayOfMonth||25)+'-ны өдөр';
  if(r.type==='quarterly')return'Улирал бүрийн '+(r.dayOfMonth||25)+'-ны өдөр';
  if(r.type==='semiannual')return'Хагас жил бүрийн '+(r.dayOfMonth||25)+'-ны өдөр';
  if(r.type==='annual')return'Жил бүрийн '+MONTHS[parseInt(r.month)||11]+' сарын '+(r.dayOfMonth||25);
  if(r.type==='adhoc')return'Тухай бүр (тухайн үед)';
  return'';
}
function urgBadge(days){
  const c=urgColor(days),txt=days===null?'—':days<0?Math.abs(days)+'х хоцорсон':days===0?'Өнөөдөр!':days+'ш үлдсэн';
  return '<span class="urg-bdg" style="color:'+c+';background:'+c+'18">'+txt+'</span>';
}
function statusBadge(s){
  if(!s)return'';
  const cls=['Явуулсан','Батлагдсан','Дууссан'].includes(s)?'bdg-ok':['Бэлтгэж байна','Батлагдаагүй'].includes(s)?'bdg-warn':'bdg-info';
  return '<span class="bdg '+cls+'">'+s+'</span>';
}
function showToast(msg,col){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:24px;right:24px;background:'+(col||'#2f6fed')+';color:white;padding:12px 20px;border-radius:10px;font-size:13px;z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.2)';
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},2500);
}

function acceptReport(idx,repsJson){
  const reps=typeof repsJson==='string'?JSON.parse(repsJson):repsJson;
  const r=reps[idx];if(!r)return;
  if(r.isRecurring){
    S.data.recurring.push({id:genId(),createdAt:new Date().toISOString(),title:r.title,to:r.to||'',type:r.recurType||'monthly',dayOfMonth:r.recurDay||'25',dayOfWeek:'1',month:'11',note:r.content||''});
    saveData();showToast('Тогтмол тайланд бүртгэгдлээ ✓','#059669');
  }else{
    S.data.reports.push({id:genId(),createdAt:new Date().toISOString(),title:r.title,to:r.to||'',period:r.period||'',deadline:r.deadline||'',date:todayStr(),content:r.content||'',status:'Бэлтгэж байна'});
    S.data.events.push({id:genId(),createdAt:new Date().toISOString(),title:r.title,date:todayStr(),type:'Тайлагнал',description:'AI шинжилгээгээр үүсгэгдсэн. Хүргүүлэх: '+(r.to||'—'),result:r.content||''});
    saveData();showToast('Тайлан болон үйл явдалд бүртгэгдлээ ✓','#059669');
  }
  const card=document.getElementById('sug-'+idx);if(card)card.classList.add('accepted');
  const btn=document.getElementById('sug-btn-'+idx);if(btn){btn.innerHTML='<i class="ti ti-check"></i> Бүртгэгдлээ';btn.disabled=true;}
}

function attemptAdminLogin(){
  var pwEl=document.getElementById('lg_admin_pw');
  var pw=pwEl?pwEl.value.trim():'';
  if(!pw){S.adminLoginError='Нууц үгээ оруулна уу';render();return;}
  if(String(pw)!==String(S.data.adminPassword||'ШГА2026')){S.adminLoginError='Нууц үг буруу байна';render();return;}
  var staffList=(S.data.staff||STAFF_LIST);
  var admin=staffList.find(function(s){return s.isAdmin;});
  if(!admin){S.adminLoginError='Admin эрхтэй ажилтан бүртгэгдээгүй байна';render();return;}
  S.currentUser=String(admin.id);S.staffFilter='';S.loginError=null;S.adminLoginError=null;S.loginShowAdmin=false;S.reportDocKey=null;
  try{localStorage.setItem('ajl_login_uid',S.currentUser);}catch(e){}
  render();
}
function attemptLogin(){
  var nameEl=document.getElementById('lg_name'),pinEl=document.getElementById('lg_pin');
  var uid=nameEl?nameEl.value:'';
  var pin=pinEl?pinEl.value.trim():'';
  if(!uid){S.loginError='Нэрээ сонгоно уу';render();return;}
  var s=(S.data.staff||STAFF_LIST).find(function(x){return String(x.id)===String(uid);});
  if(!s||String(s.pin)!==String(pin)){S.loginError='Код буруу байна';render();return;}
  S.currentUser=String(s.id);S.staffFilter=String(s.id);S.loginError=null;S.reportDocKey=null;
  try{localStorage.setItem('ajl_login_uid',S.currentUser);}catch(e){}
  render();
}
function logout(){
  S.currentUser=null;S.staffFilter='';S.reportDocKey=null;
  try{localStorage.removeItem('ajl_login_uid');}catch(e){}
  render();
}

function weekStartOf(dateStr){
  var d=dateStr?new Date(dateStr+'T00:00:00'):new Date();
  var day=d.getDay();var diff=(day===0?-6:1-day);
  d.setDate(d.getDate()+diff);
  return d.toISOString().split('T')[0];
}
function weekEndOf(weekStartStr){
  var d=new Date(weekStartStr+'T00:00:00');d.setDate(d.getDate()+6);
  return d.toISOString().split('T')[0];
}
function weekLabel(weekStartStr){
  var s=new Date(weekStartStr+'T00:00:00');var e=new Date(weekEndOf(weekStartStr)+'T00:00:00');
  function f(d){return (d.getMonth()+1)+'/'+d.getDate();}
  return s.getFullYear()+' — '+f(s)+' – '+f(e);
}
function currentWeeklyReport(uid,ws){
  return (S.data.weeklyReports||[]).find(function(w){return String(w.staffId)===String(uid)&&w.weekStart===ws;});
}

function collectRoleFormData(role){
  var sections=ROLE_FORMS[role]||[];
  var data={};
  if(!role||sections.length===0){
    var el=document.getElementById('rf__general');
    data.general=el?el.value.trim():'';
    return data;
  }
  sections.forEach(function(sec,si){
    if(sec.table){
      sec.categories.forEach(function(cat,ci){
        sec.cols.forEach(function(c){
          var fid='rf__t'+si+'_'+ci+'_'+c.id;
          var el=document.getElementById(fid);
          data[fid]=el?el.value:'';
        });
      });
    } else {
      sec.fields.forEach(function(f){
        var fid='rf__'+f.id;
        var el=document.getElementById(fid);
        data[fid]=el?el.value:'';
      });
    }
  });
  return data;
}
function weeklySummaryPreview(role,formData){
  formData=formData||{};
  if(!role||!(ROLE_FORMS[role]||[]).length){
    return (formData.general||'').slice(0,300);
  }
  var parts=[];
  var sections=ROLE_FORMS[role]||[];
  sections.forEach(function(sec){
    if(sec.table)return;
    (sec.fields||[]).forEach(function(f){
      var v=formData['rf__'+f.id];
      if(v!==undefined&&v!==''&&Number(v)!==0){
        parts.push(f.label+': '+v+(f.unit?' '+f.unit:''));
      }
    });
  });
  return parts.length?parts.join(', ').slice(0,300):'(мэдээлэл бөглөгдөөгүй)';
}

// ── ТАЙЛАН НЭГТГЭЛ (хуучин, дэд функц болгон ашиглагдана) ────────────────────
function myConsolidatorDepts(){
  var uid=S.currentUser;
  return Object.keys(S.data.consolidators||{}).filter(function(d){return String(S.data.consolidators[d])===String(uid);});
}

// ── ТАЙЛАН (над дээр ногдсон төлөвлөгөө/үүрэг/албан даалгаврыг бичиг тус бүрээр сонгож биелэлт бичих) ──
function reportItemKey(it){
  return it._source==='letter' ? ('letter:'+it._letterId) : ('legacy:'+(it.planNum!=null?it.planNum:it._label));
}
// Админ → "Нэгтгэгч оноох" хэсэгт хэлтэс/Газар тус бүрт сонгосон нэгтгэгч нь дараах 2 тохиолдолд тухайн
// заалтыг өөрийн "Тайлан" цэсэндээ (бусад хэн ч биш, зөвхөн тэр хүн) хараад, БИЕЛЭЛТИЙГ НЬ ОРОНД НЬ БИЧИЖ
// болно:
//  1) Үндсэн "Хариуцах нэгж" нь ГАЗАР бол — Газарт нэр дэвшин бүртгэгдсэн жинхэнэ ажилтан байхгүй тул, тухайн
//     Газрын нэгтгэгч л Газрын өмнөөс мэдээллийг цуглуулж, биелэлтийг бичнэ.
//  2) "Нэмэлт (давхар) хэлтэс" болгож нэмсэн хэлтэс/Газар бол — үндсэн хариуцагч аль хэдийн заалтыг хардаг ч,
//     нэмэлтээр орсон хэлтэс/Газрын нэгтгэгч мөн адил хараад бичих боломжтой (мэдээллийг нэгжүүдээс нь
//     нэгтгэж авах гэсэн санаа).
function consolidatorGrantsAccess(it,uid){
  if(!uid)return false;
  var cons=S.data.consolidators||{};
  if(isGazarDept(it.dept)&&cons[it.dept]&&String(cons[it.dept])===String(uid))return true;
  return (it.extraDepts||[]).some(function(d){return cons[d]&&String(cons[d])===String(uid);});
}
function myReportWorkItems(){
  var uid=S.currentUser; if(!uid)return[];
  var me=currentStaffObj();
  return getAllWorkItems().filter(function(it){
    if(String(it.staffId)===String(uid))return true;
    if((it.extraStaff||[]).some(function(id){return String(id)===String(uid);}))return true;
    // Тодорхой хариуцах алба хаагч сонгогдоогүй (зөвхөн хэлтэс сонгогдсон) заалт өмнө нь ХЭНИЙ Ч "Ажлын биелэлт"
    // цэсэнд харагддаггүй байсан тул хэн ч харахгүй, хариуцахгүй "алга болдог" асуудалтай байв. Иймд ийм заалтыг
    // тухайн хэлтсийн БҮХ ажилтанд (тодорхой хүн томилогдох хүртэл) харуулж, хэн нэг нь эхэлж бөглөх боломжтой болгоно.
    if(!it.staffId&&it.dept&&me&&me.dept===it.dept)return true;
    // Газар (үндсэн эсвэл нэмэлт хэлтэс) байвал тухайн Газрын нэгтгэгч (зөвхөн тэр хүн, бүх ажилтан биш)
    // мэдээллийг нэгжээс нь цуглуулж, өөрийн "Тайлан" цэсэндээ орж биелэлтийг оронд нь бичих боломжтой.
    if(consolidatorGrantsAccess(it,uid))return true;
    return false;
  });
}
function reportDocGroups(){
  var mine=myReportWorkItems();
  var map={},order=[];
  mine.forEach(function(it){
    var k=reportItemKey(it);
    if(!map[k]){map[k]={key:k,label:it._label||'—',docType:it._docType||'',from:it._from||'',items:[]};order.push(k);}
    map[k].items.push(it);
  });

function isLetterArchived(l){
  // Тайлан бүрэн баталгаажиж илгээгдэхэд (consolidatedStatus==='finalized') тухайн бичгээс эхэлсэн бүх үйл явц
  // (заалт хуваарилалт, санал асуулт, биелэлт) дууссан гэж үзэн "Архив" руу шилжинэ — идэвхтэй жагсаалт,
  // хяналт, сануулгуудад дахин харагдахгүй, харин Архив таб-аас хэзээ ч буцаж харагдана.
  return !!(l&&l.consolidatedStatus==='finalized');
}
function isLetterRecurring(l){
  // Тайлан нэгтгэгч "Тогтмол тайлан болгох"-г сонговол тухайн мөчлөг архивт биш, харин Тайлан табын
  // "Тогтмол тайлан" дэд табад давтамжаар нь ангилагдан харагдана — дараагийн мөчлөгийг дахин бэлдэж болно.

function isLetterCategorized(l){
  // Бүлэг (groupCat) сонгогдсон бичиг Нүүр хуудасны "Бүлгээр" харагдац болон Төлөвлөгөөний хяналтад
  // аль хэдийн харагддаг тул "Ирсэн бичиг"-ийн энгийн бүртгэлийн жагсаалтад давхардуулж харуулахгүй —
  // засах/устгах/ажлын урсгал удирдах боломж нь Төлөвлөгөөний хяналт хэсгээс хэвээр хүртээмжтэй байна.
  return !!(l&&l.groupCat);
}

function makeReportRecurring(letterId){
  var letter=findLetter(letterId);if(!letter)return;
  var typeEl=document.getElementById('rc-type-'+letterId);
  var dateEl=document.getElementById('rc-date-'+letterId);
  var type=typeEl?typeEl.value:'monthly';
  var dueDate=dateEl?dateEl.value:'';
  if(!dueDate){showToast('Дараагийн огноог сонгоно уу','#fbbf24');return;}
  var uid=S.currentUser;
  if(!letter.reportCycles)letter.reportCycles=[];
  letter.reportCycles.push({id:genId(),text:letter.consolidatedReportText||'',finalizedAt:new Date().toISOString(),finalizedBy:uid,periodLabel:REPORT_RECUR_LABELS[type]||'',dueDate:letter.nextReportDueDate||''});
  // Заалт бүрийн биелэлтийн текстийг СЭТГЭМЖГҮЙ хэвээр үлдээнэ (устгахгүй) — дараагийн мөчлөгийн эхлэл болгон
  // ашиглана, харин статусыг нь дахин "илгээгдээгүй" болгож шинэ мөчлөгийг эхлүүлнэ.
  consolidateItemsFor(letter).forEach(function(it){
    if(it.reportStatus==='approved'||it.reportStatus==='submitted'||it.fulfillment){
      if(!it.fulfillmentHistory)it.fulfillmentHistory=[];
      it.fulfillmentHistory.push({id:genId(),text:it.fulfillment||'',submittedAt:it.reportSubmittedAt||null,approvedAt:it.reportApprovedAt||null,status:it.reportStatus||'approved'});
    }
    it.reportStatus='';it.reportSubmittedAt=null;it.reportApprovedAt=null;it.reportReturnReason='';
    it.consolidated=false;
  });
  letter.consolidatedStatus='recurring';
  letter.reportRecurrence=type;
  letter.nextReportDueDate=dueDate;
  saveData();closeModal();showToast('Тогтмол тайлан болголоо ✓ Дараагийн хугацаа: '+fmt(dueDate),'#059669');render();
}

  var msg='Энэ тайланг эцэслэн баталгаажуулж "илгээсэн" гэж тэмдэглэх үү?\n\nҮүний дараа тайлан цоожлогдож, зөвхөн Админ дахин нээж болно.';

function archiveGroupedHtml(list){
  var order=ensureCatOrderComplete();
  var groups={},keys=[];
  list.forEach(function(l){
    var k=l.groupCat||'__none__';
    if(!groups[k]){groups[k]={key:k,name:archiveGroupLabel(l.groupCat),items:[]};keys.push(k);}
    groups[k].items.push(l);
  });
  keys.sort(function(a,b){
    if(a==='__none__')return 1; if(b==='__none__')return -1;
    var ia=order.indexOf(a),ib=order.indexOf(b);
    if(ia===-1&&ib===-1)return (groups[a].name||'').localeCompare(groups[b].name||'',undefined,{numeric:true,sensitivity:'base'});
    if(ia===-1)return 1; if(ib===-1)return -1;
    return ia-ib;
  });
  return keys.map(function(k){
    var g=groups[k];
    return '<div style="margin-bottom:18px"><h3 style="font-size:13.5px;font-weight:500;color:#8aaace;margin-bottom:8px"><i class="ti ti-folder" style="margin-right:5px;color:#2DD4BF"></i>'+esc(g.name)+' ('+g.items.length+')</h3><div class="card">'+g.items.map(archiveLetterRowHtml).join('')+'</div></div>';
  }).join('');
}

function getAllDeadlines(){
  const rows=[];
  S.data.letters_in.filter(x=>x.deadline).forEach(x=>rows.push({id:x.id,title:x.subject||'Бичиг',type:'Ирсэн бичиг',days:daysLeft(x.deadline)}));
  getAllWorkItems().filter(function(it){return it.dueDate&&isIsoDate(it.dueDate)&&!it.done;}).forEach(function(it){rows.push({id:it.id,title:(it.text||'Заалт').slice(0,40),type:'Ажлын заалт',days:daysLeft(it.dueDate),isRec:!!it.recurring});});
  return rows.sort((a,b)=>(a.days??9999)-(b.days??9999)).slice(0,12);
}

    // байгаад буцаж ирэхэд (эсвэл ямар нэг өөр шалтгаанаар дахин render() дуудагдвал) бичиж байсан бүх

      // шалгадаг saveNewGroup()-оор) үүсгэнэ.

function eventsMonthKey(dateStr){ if(!dateStr) return ''; var d=new Date(dateStr); if(isNaN(d.getTime())) return ''; return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function eventsMonthLabel(key){ if(!key) return 'Огноогүй'; var p=key.split('-'); return p[0]+' оны '+MONTHS[parseInt(p[1])-1]; }
function eventsGroupBuckets(){
  var items=S.data.events||[];
  var map={};
  items.forEach(function(it){
    var key = S.evGroupBy==='type' ? (it.type||'Бусад') : eventsMonthKey(it.date);
    var label = S.evGroupBy==='type' ? (it.type||'Бусад') : eventsMonthLabel(key);
    if(!map[key]) map[key]={key:key,label:label,count:0};
    map[key].count++;
  });
  var arr=Object.keys(map).map(function(k){return map[k];});
  if(S.evGroupBy==='type') arr.sort(function(a,b){return b.count-a.count;});
  else arr.sort(function(a,b){return (b.key||'').localeCompare(a.key||'');});
  return arr;
}
function setEvGroupBy(mode){ S.evGroupBy=mode; S.evGroupSel=''; render(); }
function setEvGroupSel(key){ S.evGroupSel=key; render(); }

    +'<button class="btn" style="background:'+(S.evGroupBy==='type'?'#16213d':'transparent')+';box-shadow:'+(S.evGroupBy==='type'?'0 1px 2px rgba(0,0,0,.08)':'none')+';color:#E7EDF7" onclick="setEvGroupBy(\'type\')"><i class="ti ti-tag"></i>Төрлөөр</button>'
    +'</div>';

function buildAIContext(){
  const d=S.data;
  // Include file contents for context
  const liFiles=d.letters_in.filter(x=>x.files&&x.files.length).map(x=>'['+x.subject+'] файл: '+x.files.map(f=>f.text.slice(0,500)).join(' | ')).join('\n');
  const workItems=getAllWorkItems();
  const activeAssigned=workItems.filter(function(it){return it.staffId&&!it.done;}).slice(0,40);
  const doneWithFulfillment=workItems.filter(function(it){return it.fulfillment;}).slice(0,30);
  return`Та монгол хэлээр хариулна уу. Та монгол байгууллагын ажлын туслах AI систем юм.

ӨМНӨХ БИЕЛЭЛТИЙН ЖИШЭЭ (${doneWithFulfillment.length}): ${doneWithFulfillment.length?doneWithFulfillment.map(function(it){return '• '+(it.text||'').slice(0,80)+' → '+(it.fulfillment||'').slice(0,150);}).join('\n'):'Байхгүй'}
${liFiles?'ХАВСАРГАСАН ФАЙЛУУДЫН АГУУЛГА:\n'+liFiles:''}`;

async function doSendAI(){
  const inp=document.getElementById('ai-input');
  const msg=(inp?inp.value:'').trim();
  if(!msg||S.aiLoading)return;
  const key=getApiKey();if(!key){openSettings();return;}
  if(inp)inp.value='';
  S.aiMsgs.push({role:'user',content:msg});S.aiLoading=true;renderMain();

async function universalUpload(files) {
  var fileList = files instanceof FileList ? Array.from(files) : [files];
  if(!fileList.length) return;
  var key = getApiKey();
  if(!key){openSettings();return;}
  showToast(fileList.length+' файл шинжилж байна...','#a78bfa');
  var allFiles = [];
  for(var fi=0;fi<fileList.length;fi++){
    var fdata = await readOneFile(fileList[fi]);
    allFiles.push(fdata);
  }
  var validFiles = allFiles.filter(function(f){return f.text && !f.text.startsWith('[');});
  if(!validFiles.length){showToast('Файл уншиж чадсангүй','#fb7185');return;}
  var filesText = validFiles.map(function(f){return '=== '+f.name+' ===\n'+f.text.slice(0,2000);}).join('\n\n');
  var prompt = 'Дараах баримт бичгүүдийг уншаад JSON өгөөч. Манай албанд ирсэн бичиг гэж бүгдийг үзнэ (төлөвлөгөө, хууль/тогтоомжийн төсөл, хурлын тэмдэглэл, албан даалгавар, үүрэг чиглэл, бусад — бүгд Ирсэн бичигт бүртгэгдэнэ). ЗӨВХӨН JSON. '+filesText+' Формат: {"documents":[{"filename":"нэр","docType":"Төлөвлөгөө эсвэл Төсөл эсвэл Хурлын тэмдэглэл эсвэл Албан даалгавар эсвэл Үүрэг чиглэл эсвэл Бусад","title":"Монгол хэлээр товч нэр","summary":"Агуулга","number":"Дугаар","date":"YYYY-MM-DD","from":"Илгээгч байгууллага","deadline":"YYYY-MM-DD","clauses":[{"text":"Заалт","deadline":"YYYY-MM-DD"}]}]}';
  try {
    var r = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:4000,messages:[{role:'user',content:prompt}]})});
    var d = await r.json();
    if(d.error){showToast('API алдаа: '+d.error.message,'#fb7185');return;}
    var txt = (d.content&&d.content[0]?d.content[0].text||'{}':'{}').replace(/```json|```/g,'').trim();
    var parsed;
    try{parsed=JSON.parse(txt);}catch(e){parsed={documents:[]};}
    if(!parsed.documents||!parsed.documents.length){showToast('Баримт ангилж чадсангүй','#fbbf24');return;}
    var summary = [];
    for(var i=0;i<parsed.documents.length;i++){
      var doc = parsed.documents[i];
      var fileData = validFiles.find(function(f){return f.name===doc.filename;})||validFiles[Math.min(i,validFiles.length-1)];
      var clauses=(doc.clauses||[]).map(function(c){return {id:genId(),text:c.text||'',criteria:'',baseline:'',target:'',groupId:'',dept:'',staffId:'',extraStaff:[],dueDate:c.deadline||'',recurring:false,done:false,fulfillment:''};});
      var li = {id:genId(),createdAt:new Date().toISOString(),number:doc.number||'',date:doc.date||todayStr(),from:doc.from||'',docType:doc.docType||'Бусад',subject:doc.title||doc.summary||'',deadline:doc.deadline||'',note:doc.summary||'',files:[fileData],distItems:clauses};
      S.data.letters_in.push(li);
      summary.push('📥 '+(doc.docType||'Бичиг')+': '+doc.title+(clauses.length?' ('+clauses.length+' заалт)':''));
    }
    saveData();
    S.universalSummary = summary;
    S.universalDocs = parsed.documents;
    setTab('dashboard');
    render();
    showToast(summary.length+' баримт амжилттай бүртгэгдлээ ✓','#059669');
    setTimeout(function(){askAIAdvice(parsed.documents, summary);}, 500);
  } catch(e){showToast('Алдаа: '+e.message,'#fb7185');}
}

      else if(fdata.text&&fdata.text.includes('mammoth')){showToast('Word файл уншиж чадсангүй','#fb7185');}

    }
    var prompt='Дараах '+(isIn?'ирсэн':'явуулсан')+' албан бичгийг уншаад мэдээллийг ялган авч зөвхөн JSON форматаар өгөөч. Тайлбар бичихгүй. Бичиг: '+fdata.text.slice(0,3000)+' Формат: '+fields+'. Олдоогүй талбарыг хоосон string байлга.';
    try{
      var r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:500,messages:[{role:'user',content:prompt}]})});
      var d=await r.json();
      if(d.error){showToast('API алдаа: '+d.error.message,'#fb7185');break;}
      var txt=(d.content&&d.content[0]?d.content[0].text||'{}':'{}').replace(/```json|```/g,'').trim();
      var parsed;try{parsed=JSON.parse(txt);}catch(e){parsed={};}
      var newItem={id:genId(),createdAt:new Date().toISOString(),files:[fdata]};

      if(isIn&&!newItem.distItems)newItem.distItems=[];
      S.data[letterType].push(newItem);

      added++;

async function extractEventsFromFile(files) {
  var fileList = files instanceof FileList ? Array.from(files) : [files];
  if(!fileList.length) return;
  showToast(fileList.length+' файл уншиж байна...','#22d3ee');
  var allTexts = '';
  var failedFiles = [];
  for(var i=0;i<fileList.length;i++){
    var fdata = await readOneFile(fileList[i]);
    if(fdata.text && !fdata.text.startsWith('[')) {
      allTexts += '=== '+fdata.name+' ===\n'+fdata.text+'\n\n';
    } else {
      failedFiles.push(fdata.name+': '+(fdata.text||'хоосон'));
    }
  }
  if(!allTexts.trim()){
    var msg = failedFiles.length ? 'Файл уншиж чадсангүй: '+failedFiles.join(', ') : 'Файл уншиж чадсангүй';
    showToast(msg,'#fb7185');
    // Try showing in alert for debug
    if(failedFiles.length) alert('Алдаа:\n'+failedFiles.join('\n')+'\n\nXLSX ачаалсан уу: '+(typeof XLSX!=='undefined'?'Тийм':'Үгүй')+'\nmammoth ачаалсан уу: '+(typeof mammoth!=='undefined'?'Тийм':'Үгүй'));
    return;
  }
  var key=getApiKey();
  if(!key){openSettings();return;}
  showToast('AI үйл явдлуудыг ялган авч байна...','#DB2777');
  var prompt='Та ажлын тайлангаас бүх хийгдсэн ажил, үйл явдлуудыг олоод JSON array болгон буцаа. ЗӨВХӨН JSON, өөр юм бичихгүй. Формат: {"events":[{"title":"string","date":"YYYY-MM-DD","type":"Сургалт эсвэл Хурал эсвэл Байцаалт эсвэл Семинар эсвэл Тайлагнал эсвэл Уулзалт эсвэл Бусад","description":"string","result":"string"}]}. Тайлан: '+allTexts;
  fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:2000,messages:[{role:'user',content:prompt}]})})
  .then(function(r){return r.json();})
  .then(function(d){
    var txt=(d.content&&d.content[0]?d.content[0].text||'{}':'{}').replace(/```json|```/g,'').trim();
    var parsed;try{parsed=JSON.parse(txt);}catch(e){parsed={events:[]};}
    if(!parsed.events||!parsed.events.length){
      showToast('Үйл явдал олдсонгүй','#fbbf24');
      if(confirm('AI хариу харах уу? (дибаг)')){alert('AI хариу:\n'+txt.slice(0,500));}
      return;
    }
    parsed.events.forEach(function(e){S.data.events.push({id:genId(),createdAt:new Date().toISOString(),title:e.title||'',date:e.date||todayStr(),type:e.type||'Бусад',description:e.description||'',result:e.result||''});});
    saveData();showToast(parsed.events.length+' үйл явдал бүртгэгдлээ ✓','#059669');render();
  })
  .catch(function(e){showToast('Алдаа: '+e.message,'#fb7185');});
}

      if(S.tab==='reports'){
        const evIdx=S.data.events.findIndex(e=>e.title&&e.title.includes(old.title||''));

        }

    showToast('Засвар хадгалагдлаа ✓','#059669');render();
    return;
  }

  // Шинэ бичлэг нэмэх
  const newItem={id:genId(),createdAt:new Date().toISOString(),...formData};
  if(S.tab==='letters_in'&&!newItem.distItems)newItem.distItems=[];

// ── CALENDAR ───────────────────────────────────────────────────────────────────
function renderCalendar(){
  var y=S.calYear,m=S.calMonth;
  var MN=['1-р сар','2-р сар','3-р сар','4-р сар','5-р сар','6-р сар','7-р сар','8-р сар','9-р сар','10-р сар','11-р сар','12-р сар'];
  var WD=['Да','Мя','Лх','Пү','Ба','Бя','Ня'];
  var firstDay=new Date(y,m,1).getDay();
  firstDay=(firstDay+6)%7; // Monday first
  var daysInMonth=new Date(y,m+1,0).getDate();
  var today=new Date();today.setHours(0,0,0,0);

  // Collect all events for this month
  var evMap={};
  function addEv(dateStr,ev){
    if(!dateStr)return;
    var d=new Date(dateStr);
    if(d.getFullYear()===y&&d.getMonth()===m){
      var day=d.getDate();
      if(!evMap[day])evMap[day]=[];
      evMap[day].push(ev);
    }
  }
  // Letters deadlines
  (S.data.letters_in||[]).forEach(function(x){addEv(x.deadline,{label:(x.subject||'Бичиг').slice(0,20),color:'#3B82F6',type:'Ирсэн бичиг'});});
  // Events
  (S.data.events||[]).forEach(function(x){addEv(x.date,{label:(x.title||'Үйл явдал').slice(0,20),color:'#fbbf24',type:x.type||'Үйл явдал'});});
  // Хуваарилагдсан заалтуудын хугацаа — явуулах ёстой (шинэ ирсэн бичиг + хуучин 228 заалт нэгтгэсэн)
  getAllWorkItems().forEach(function(it){
    if(S.staffFilter&&String(it.staffId)!==String(S.staffFilter))return;
    if(it.dueDate&&!it.done)addEv(it.dueDate,{label:(it.text||'Заалт').slice(0,20),color:'#16A34A',type:'Явуулах ажил (заалт)'});
    if(it.done&&it.doneDate)addEv(it.doneDate,{label:'✓ '+(it.text||'Заалт').slice(0,20),color:'#8B5CF6',type:'Явуулсан/биелсэн'});
  });

  var cells='';
  var col=0;
  // Empty cells before first day
  for(var i=0;i<firstDay;i++){cells+='<div class="cal-cell cal-empty"></div>';col++;}
  for(var d=1;d<=daysInMonth;d++){
    var dt=new Date(y,m,d);dt.setHours(0,0,0,0);
    var isToday=dt.getTime()===today.getTime();
    var evs=evMap[d]||[];
    var evHtml=evs.slice(0,3).map(function(e){return '<div class="cal-ev" style="background:'+e.color+'20;color:'+e.color+';border-left:2px solid '+e.color+'">'+esc(e.label)+'</div>';}).join('');
    if(evs.length>3)evHtml+='<div class="cal-ev" style="color:#5f7292">+' +(evs.length-3)+' дахин</div>';
    cells+='<div class="cal-cell'+(isToday?' cal-today':'')+(evs.length?' cal-has-ev':'')+'"><div class="cal-day">'+d+'</div>'+evHtml+'</div>';
    col++;
  }
  // Fill remaining cells
  while(col%7!==0){cells+='<div class="cal-cell cal-empty"></div>';col++;}

  // Legend
  var legendItems=[
    {color:'#3B82F6',label:'Ирсэн бичгийн хариулах хугацаа'},
    {color:'#fbbf24',label:'Үйл явдал'},
    {color:'#16A34A',label:'Явуулах ёстой ажил (заалт)'},
    {color:'#8B5CF6',label:'Явуулсан / биелсэн'},
  ];
  var legend=legendItems.map(function(l){return '<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--color-text-secondary)"><span style="width:10px;height:10px;border-radius:50%;background:'+l.color+';display:inline-block"></span>'+l.label+'</span>';}).join('');

  return'<div class="page"><div class="page-hd"><h2>Хуанли</h2><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><button class="btn btn-g" onclick="S.calMonth--;if(S.calMonth<0){S.calMonth=11;S.calYear--;}render()">‹</button><span style="font-weight:500;font-size:15px">'+y+' он &nbsp;'+MN[m]+'</span><button class="btn btn-g" onclick="S.calMonth++;if(S.calMonth>11){S.calMonth=0;S.calYear++;}render()">›</button><button class="btn btn-g" onclick="var n=new Date();S.calYear=n.getFullYear();S.calMonth=n.getMonth();render()" style="font-size:12px">Өнөөдөр</button>'+staffFilterSelectHtml()+'</div></div>'
  +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">'+legend+'</div>'
  +'<div class="cal-grid">'
  +WD.map(function(d){return'<div class="cal-head">'+d+'</div>';}).join('')
  +cells
  +'</div></div>';
}

function getSendTrack(planKey){

function setSendCadence(planKey,cadence){
  var t=ensureSendTrack(planKey);
  if(t.cadence!==cadence){
    t.cadence=cadence;
    // Хяналт ХЭЗЭЭ идэвхжсэнийг (cadenceSetAt) зөвхөн НЭГ л удаа, анх удаа тохируулах үед тэмдэглэнэ — өмнө нь
    // давтамжийг сольж дахин сонгох (жиш нь сараас улирал руу) БҮР ахин ӨНӨӨДРӨӨР дарж бичдэг байсан тул, ирсэн

    // эхэлж байгаа" мэт болж, өмнөх бодит түүхтэй мөчлөгүүдийг матрицад нуучихдаг байсан. Одоо анхны утга нь

    // "албан тоот бичихдээ бичсэн огноо" гэдгээр нь эхэлнэ, "өнөөдөр" гэдгээр биш. Ийм огноо байхгүй бол (хуучин
    // жагсаалтын баримт бичиг г.м.) л өнөөдрөөр орлуулна — admin доор нь энэ огноог хүссэнээрээ засаж болно.
    if(cadence&&!t.cadenceSetAt){

function setSendTrackField(planKey,field,value){
  var t=ensureSendTrack(planKey);

  saveData();render();

function sendDueDate(track,cadence,refDate){
  refDate=refDate||new Date();
  var y=refDate.getFullYear(),m=refDate.getMonth();
  var dom=parseInt(track.dayOfMonth)||25;
  if(cadence==='weekly'){
    var dow=parseInt(track.dayOfWeek)||1; // 1=Даваа...7=Ням (WEEKDAYS индекстэй ижил конвенц)
    var dt=new Date(refDate.getFullYear(),refDate.getMonth(),refDate.getDate());
    var curDow=(dt.getDay()+6)%7;
    dt.setDate(dt.getDate()-curDow+(dow-1));
    return dt;
  }
  if(cadence==='monthly')return new Date(y,m,dom);
  if(cadence==='quarterly'){var q=Math.floor(m/3);return new Date(y,q*3+2,dom);} // улирлын СҮҮЛЧИЙН сар (3,6,9,12)
  if(cadence==='semiannual'){var h=m<6?0:1;return new Date(y,h*6+5,dom);} // 6, 12 дугаар сар
  if(cadence==='annual'){var mon=track.month!=null&&track.month!==''?parseInt(track.month):11;return new Date(y,mon,dom);}
  return null;
}

// давтамж сонгоход энэ автоматаар тухайн ирсэн бичгийн огноогоор (байгаа бол) тавигддаг ч (setSendCadence-г үз),
// хуучин жагсаалтын баримт бичигт ийм огноо байхгүй, эсвэл admin өөрөө өөр (жиш нь илүү эрт) огнооноос эхлүүлж
// матрицад өмнөх мөчлөгүүдээ (аль хэдийн олон удаа явуулсан байсан ч) харуулж, тэмдэглэмээр байвал энд засна.
function sendCadenceSetAtFieldHtml(planKey,track,cadence){
  if(!cadence||cadence==='once')return '';
  return '<div style="display:flex;align-items:center;gap:3px;margin-top:3px" title="Энэ огнооноос ХОЙШХИ мөчлөгүүд л Дэлгэрэнгүй матрицад харагдана — эрт бол илүү олон мөчлөг (өмнөх түүхээ ч бичиж болно), орой бол цөөн харагдана"><span style="font-size:9px;color:#5f7292;white-space:nowrap">Хянах эхлэл:</span><input type="date" value="'+esc(track.cadenceSetAt||'')+'" style="width:112px;font-size:10px;padding:1px 2px;border-radius:5px;border:.5px solid #26395a;background:transparent;color:#8aaace" onchange="setSendTrackField('+jsq(planKey)+',\'cadenceSetAt\',this.value)"></div>';
}
function isoWeekKey(d){
  var dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  var dayNum=(dt.getUTCDay()+6)%7;
  dt.setUTCDate(dt.getUTCDate()-dayNum+3);
  var firstThursday=new Date(Date.UTC(dt.getUTCFullYear(),0,4));
  var fdDayNum=(firstThursday.getUTCDay()+6)%7;
  var week=1+Math.round(((dt-firstThursday)/86400000-3+fdDayNum)/7);
  return dt.getUTCFullYear()+'-W'+(week<10?'0'+week:week);
}
function sendPeriodKey(cadence,d){
  d=d||new Date();
  var y=d.getFullYear(),m=d.getMonth();
  if(cadence==='weekly')return isoWeekKey(d);
  if(cadence==='monthly')return y+'-'+(m+1<10?'0'+(m+1):(m+1));
  if(cadence==='quarterly')return y+'-Q'+(Math.floor(m/3)+1);
  if(cadence==='semiannual')return y+'-H'+(m<6?1:2);
  if(cadence==='annual')return String(y);
  return 'once';
}
function sendPeriodEnd(cadence,d){
  d=d||new Date();
  var y=d.getFullYear(),m=d.getMonth();
  if(cadence==='weekly'){
    var dt=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    var day=(dt.getDay()+6)%7;
    dt.setDate(dt.getDate()+(6-day));
    dt.setHours(23,59,59,999);
    return dt;
  }
  if(cadence==='monthly')return new Date(y,m+1,0,23,59,59,999);
  if(cadence==='quarterly'){var q=Math.floor(m/3);return new Date(y,q*3+3,0,23,59,59,999);}
  if(cadence==='semiannual'){var h=m<6?0:1;return new Date(y,h*6+6,0,23,59,59,999);}
  if(cadence==='annual')return new Date(y,11,31,23,59,59,999);
  return null;
}
function isPeriodSent(track,cadence){
  if(!track||!track.log||!track.log.length)return false;
  if(cadence==='once')return track.log.length>0;
  var pk=sendPeriodKey(cadence);
  return track.log.some(function(l){return l.period===pk;});
}
var SEND_WARN_DAYS={weekly:1,monthly:5,quarterly:10,semiannual:14,annual:21};
// "Одоогийн мөчлөг"-ийн төгсгөл ямагт өнөөдрөөс хойш байдаг тул (sendPeriodEnd нь өнөөдрийг агуулсан мөчлөгийг
// л тооцдог) зөвхөн daysLeft<0-ийг шалгаад "overdue" гаргах боломжгүй — мөчлөг солигдмогц (жиш нь шинэ улирал
// эхэлмэгц) өмнөх мөчлөгөө огт мартсан ч дахин "цаг арай болоогүй" мэт цайрчихдаг байсан. Иймд ӨМНӨХ мөчлөгт
// (мөн хяналт идэвхжсэнээс хойш дуусвал) бичлэг байгаа эсэхийг НЭМЖ шалгана.
function previousPeriodRefDate(cadence,d){
  d=d||new Date();
  if(cadence==='weekly'){var dt=new Date(d.getFullYear(),d.getMonth(),d.getDate());dt.setDate(dt.getDate()-7);return dt;}
  if(cadence==='monthly')return new Date(d.getFullYear(),d.getMonth()-1,15);
  if(cadence==='quarterly')return new Date(d.getFullYear(),d.getMonth()-3,15);
  if(cadence==='semiannual')return new Date(d.getFullYear(),d.getMonth()-6,15);
  if(cadence==='annual')return new Date(d.getFullYear()-1,6,1);
  return null;
}
function sendOverdueLevel(track,cadence){
  if(!cadence||cadence==='once')return '';
  if(isPeriodSent(track,cadence))return '';
  var prevRef=previousPeriodRefDate(cadence);
  if(prevRef&&track.cadenceSetAt){
    var prevKey=sendPeriodKey(cadence,prevRef);
    var prevEnd=sendPeriodEnd(cadence,prevRef);
    var hasPrev=track.log&&track.log.some(function(l){return l.period===prevKey;});
    var prevEndStr=prevEnd?prevEnd.toISOString().split('T')[0]:null;
    if(!hasPrev&&prevEndStr&&prevEndStr>=track.cadenceSetAt)return 'overdue';
  }
  // Admin тохируулсан ТОДОРХОЙ өдрөөр (sendDueDate — жиш нь "сар бүрийн 25-ны өдөр") хэтэрсэн эсэхийг шалгана —
  // өмнө нь зөвхөн бүх мөчлөг (жиш нь бүтэн сар) дуусахыг хүлээдэг байсан тул тохируулсан өдрөө өнгөрүүлсэн ч
  // мөчлөг дуусаагүй л бол "цаг байна" гэж буруу харагддаг байв.
  var due=sendDueDate(track,cadence);
  if(!due)return '';
  var now=new Date(); now.setHours(0,0,0,0);
  var daysLeft=Math.ceil((due-now)/86400000);
  if(daysLeft<0)return 'overdue';
  if(daysLeft<=(SEND_WARN_DAYS[cadence]||5))return 'warn';
  return '';
}
function lastSendLogEntry(track){
  if(!track||!track.log||!track.log.length)return null;
  return track.log.slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');})[0];
}

// ── ДЭЛГЭРЭНГҮЙ МАТРИЦ (Жил → Хагас жил → Улирал → Сар + Тухай бүр) — хэрэглэгчийн хүссэн хэлбэрийн санал
// болгож буй хувилбар: жагсаалтын мөр бүрийг нарийн баганаар дүүргэхийн оронд, тухайн НЭГ төлөвлөгөөг
// сонгоход бүтэн жилийн харагдацтай (4 түвшинд) дэлгэрэнгүй тод харуулна. Аль ч нүд дээр дарж тэр даруй
// тэмдэглэж болно — period нь period string (жиш нь '2026-Q3') бүрэн давхцалгүй (level тус бүрдээ өвөрмөц
// формат) тул нэг log-д бүх түвшний бичлэг зэрэгцэн орших боломжтой.
function sendMatrixYear(planKey){ return (S.sendMatrixYear&&S.sendMatrixYear[planKey])||new Date().getFullYear(); }
function setSendMatrixYear(planKey,y){ S.sendMatrixYear=S.sendMatrixYear||{}; S.sendMatrixYear[planKey]=y; openSendMatrixModal(planKey); }
function sendMatrixCellStatus(track,level,repDate){
  var pk=sendPeriodKey(level,repDate);
  var sent=(track.log||[]).some(function(e){return e.period===pk;});
  if(sent)return 'sent';
  var end=sendPeriodEnd(level,repDate);
  var now=new Date(); now.setHours(0,0,0,0);
  if(end&&end<now)return 'overdue';
  if(track.cadence===level){
    var due=sendDueDate(track,level,repDate);
    if(due){
      var daysLeft=Math.ceil((due-now)/86400000);
      if(daysLeft<0)return 'overdue';
      if(daysLeft<=(SEND_WARN_DAYS[level]||5))return 'warn';
    }
  }
  return (end&&end>=now)?'pending':'';
}
function sendMatrixCellHtml(planKey,track,level,repDate,label){
  var pk=sendPeriodKey(level,repDate);
  var status=sendMatrixCellStatus(track,level,repDate);
  var bg=status==='sent'?'#0f2a22':status==='overdue'?'#2a1420':status==='warn'?'#241b12':'#0d1626';
  var color=status==='sent'?'#34d399':status==='overdue'?'#fb7185':status==='warn'?'#fbbf24':'#8aaace';
  var icon=status==='sent'?' <i class="ti ti-check" style="font-size:10px"></i>':'';
  return '<td onclick="openSendMatrixCheck('+jsq(planKey)+','+jsq(level)+','+jsq(pk)+')" title="'+esc(label)+' — дарж тэмдэглэнэ үү" style="cursor:pointer;text-align:center;padding:9px 3px;border:.5px solid #26395a;background:'+bg+';color:'+color+';font-size:11.5px;vertical-align:middle">'+esc(label)+icon+'</td>';
}
// Тухайн level-ийн (repDate агуулсан) мөчлөг хяналт идэвхжсэнээс (track.cadenceSetAt) ӨМНӨ бүрэн дууссан эсэхийг
// шалгаж, хэрэв тийм бол матрицад НУУНА — "төлөвлөгөө үүссэнээс хойш эдгээр нь бөглөгдөнө" гэсэн хэрэглэгчийн
// тодотголын дагуу, хяналт эхлэхээс өмнөх (хэзээ ч шаардлагагүй байсан) мөчлөгүүдийг хоосон/саарал харуулахгүй.
function sendMatrixPeriodVisible(track,level,repDate){
  if(!track.cadenceSetAt)return true;
  var end=sendPeriodEnd(level,repDate);
  var endStr=end?end.toISOString().split('T')[0]:null;
  return !endStr||endStr>=track.cadenceSetAt;
}
// Зөвхөн тухайн ТӨЛӨВЛӨГӨӨНИЙ сонгосон ЦОРЫН ГАНЦ давтамжийн (жиш нь зөвхөн "Улирал бүр" бол зөвхөн 4 улирал)
// мөрийг л үзүүлнэ — нэг зэрэг 7 хоног/сар/улирал/хагас жил/жилээр давхар тэмдэглэх шаардлагагүй гэдгийг
// тодотгосон хэрэглэгчийн санал дагуу.
function sendMatrixLevelTableHtml(planKey,track,year){
  var cadence=track.cadence;
  var cells='';
  if(cadence==='annual'){
    var d=new Date(year,5,1);
    if(sendMatrixPeriodVisible(track,'annual',d))cells=sendMatrixCellHtml(planKey,track,'annual',d,year+' он — Жил');
  } else if(cadence==='semiannual'){
    var hLabels=['Эхний хагас жил','Сүүлийн хагас жил'],hDates=[new Date(year,2,1),new Date(year,8,1)];
    cells=hDates.map(function(d,i){return sendMatrixPeriodVisible(track,'semiannual',d)?sendMatrixCellHtml(planKey,track,'semiannual',d,hLabels[i]):'';}).join('');
  } else if(cadence==='quarterly'){
    var qLabels=['I улирал','II улирал','III улирал','IV улирал'],qDates=[new Date(year,1,1),new Date(year,4,1),new Date(year,7,1),new Date(year,10,1)];
    cells=qDates.map(function(d,i){return sendMatrixPeriodVisible(track,'quarterly',d)?sendMatrixCellHtml(planKey,track,'quarterly',d,qLabels[i]):'';}).join('');
  } else if(cadence==='monthly'){
    cells=Array.from({length:12},function(_,i){return new Date(year,i,1);}).map(function(d,i){
      return sendMatrixPeriodVisible(track,'monthly',d)?sendMatrixCellHtml(planKey,track,'monthly',d,(i+1)+'-р сар'):'';
    }).join('');
  }
  if(!cells)return '<div style="font-size:12.5px;color:#5f7292;padding:10px 0">Энэ жилд харуулах мөчлөг алга (хяналт хожуу идэвхжсэн эсвэл цаашдын жил).</div>';
  return '<table style="width:100%;border-collapse:collapse;table-layout:fixed"><tr>'+cells+'</tr></table>';
}
// "7 хоног бүр" сонгосон бол — 1 сард хэдэн 7 хоног байдаг тэр бүрээр нь, сар тус бүрээр бүлэглэж харуулна.
function sendMatrixWeeklyHtml(planKey,track,year){
  var months=Array.from({length:12},function(){return [];});
  var d=new Date(year,0,1);
  var day=(d.getDay()+6)%7; d.setDate(d.getDate()-day);
  if(d.getFullYear()<year){ d.setDate(d.getDate()+7); }
  var guard=0;
  while(d.getFullYear()===year&&guard<60){
    months[d.getMonth()].push(new Date(d));
    d=new Date(d); d.setDate(d.getDate()+7);
    guard++;
  }
  var groups=months.map(function(weeks,mi){
    var visible=weeks.filter(function(wd){return sendMatrixPeriodVisible(track,'weekly',wd);});
    if(!visible.length)return '';
    var cellsHtml=visible.map(function(wd,wi){return sendMatrixCellHtml(planKey,track,'weekly',wd,(wi+1)+'-р 7х');}).join('');
    return '<div style="margin-bottom:8px"><div style="font-size:10.5px;color:#5f7292;margin-bottom:3px">'+(mi+1)+'-р сар</div><table style="border-collapse:collapse;width:100%;table-layout:fixed"><tr>'+cellsHtml+'</tr></table></div>';
  }).join('');
  return groups||'<div style="font-size:12.5px;color:#5f7292;padding:10px 0">Энэ жилд харуулах 7 хоног алга (хяналт хожуу идэвхжсэн эсвэл цаашдын жил).</div>';
}

  var t=getSendTrack(planKey);

  } else if(t.cadence==='weekly'){
    body=sendMatrixWeeklyHtml(planKey,t,year);
  } else {
    body=sendMatrixLevelTableHtml(planKey,t,year);

  var yearNav='<div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px">'

function sendMonCadenceCellHtml(planKey,track,col){
  if(track.cadence!==col)return '<td style="padding:6px 4px;text-align:center;color:#3d4d6b">—</td>';

  var lvl=sendOverdueLevel(track,col);
  var bg=sent?'#0f2a22':(lvl==='overdue'?'#2a1420':(lvl==='warn'?'#241b12':'transparent'));
  var color=sent?'#34d399':(lvl==='overdue'?'#fb7185':(lvl==='warn'?'#fbbf24':'#8aaace'));
  var icon=sent?'ti-circle-check':(lvl==='overdue'?'ti-alert-triangle':'ti-circle-dashed');

function sendMonOnceCellHtml(planKey,track){

function autoGrowAllTextareas(){

  // ингэхгүй бол зөвхөн хэрэглэгч гараар бичиж эхлэх үед (oninput) л томордог тул хуучин өгөгдөл ачаалахад хайрцаг багтахгүй харагддаг байсан.
  var tas=document.querySelectorAll('textarea.autogrow-ta');

function goTop(){ S._scrollResetNext=true; }
function fixDistTableStickyOffsets(){
  // Тайлбар: өмнө нь энд thead-ийн sticky "top"-г дээд bar1 мөрийн өндрөөр (h+'px') тохируулдаг байсан.
  // Гэвч #disttbl-... хайрцаг нь v53-аас хойш өөрөө тусдаа хязгаарлагдмал гүйлгэдэг муж (overflow:auto;max-height)
  // болсон тул thead нь #main эсвэл bar1-тэй ХАМААРАЛГҮЙгээр зөвхөн ӨӨРИЙН энэ хайрцгийн дотоод гүйлгэлттэй
  // харьцангуйгаар sticky болдог. Иймд bar1-ийн өндрийг thead-ийн "top"-д тавихад thead нь хайрцгийн дотор
  // байнга (гүйлгээгүй үед ч) доош шахагдаж, 1-р мөртэй давхцаж "давхар" харагдах согог үүсгэдэг байв.
  // Тиймээс thead-ийн sticky "top" нь үргэлж 0 байх ёстой (theadStickyBase-д аль хэдийн 0-ээр тохируулсан) —
  // энэ функц одоо зөвхөн аюулгүйн үүднээс 0-д буцаан тохируулж, хуучин утга үлдсэн эсэхийг шалгана.
  var wraps=document.querySelectorAll('[id^="disttbl-"]');
  for(var i=0;i<wraps.length;i++){
    var ths=wraps[i].querySelectorAll('thead th');
    for(var j=0;j<ths.length;j++){ ths[j].style.top='0px'; }
  }
}
function render(){
  // Тайлбар: render() нь #main-ийн innerHTML-ийг бүхэлд нь дахин бичдэг тул, хэрэв тухайн мөчид фокустой байсан
  // input/textarea (жиш нь баганын өргөнийг чирж тохируулж дуусаад render() дуудагдах үед хараахан blur хийгээгүй
  // текст талбар) DOM-оос хасагдвал, браузер тэр даруй 'blur' эвент шидэж, тэр нь заримдаа тухайн талбарын
  // onchange handler-ыг (жишээ нь updateDistItem гэх мэт, дотроо saveData();render(); дуудна) СИНХРОНААР
  // өдөөдөг. Ингэснээр render() дундаас дахин render() дуудагдаж (reentrant/давхар орох), эх (гадаад) innerHTML
  // тохируулах үйлдэл дуусаагүй байхад дотоод render() өөр нэг innerHTML тохируулга хийчихээд, гадаад үйлдэл
  // буцаж ирэхэд "The node to be removed is no longer a child of this node" гэсэн NotFoundError шидэгддэг байсан
  // (жишээ нь: баганы өргөн чирч тохируулаад дуусахад — onColResizeEnd → render() — ийм байдлаар давхцдаг байв).
  // Үүнээс сэргийлж, render() ажиллаж байх үед дахин дуудагдвал бодит ажлыг хойшлуулж, гадаад render() дуусмагц
  // ганцхан удаа дахин (сүүлчийн өгөгдлөөр) render() хийж, өгөгдөл бүрэн зөв тусгагдахыг баталгаажуулна.
  if(S._rendering){ S._renderQueued=true; return; }
  S._rendering=true;
  try{
    var loggedIn=!!S.currentUser;
    var navEl=document.querySelector('nav'),mainEl=document.getElementById('main'),lg=document.getElementById('loginGate');
    // Хуудасны төлөв өөрчлөгдөх (сонголт хийх, талбар засах гэх мэт) бүрд #main дахин бичигдэх ч гүйлгэсэн байрлал алдагдахгүй байхын тулд
    // scroll-ыг (босоо болон distTableEditable хүснэгтийн хажуугийн scroll-ыг) хадгалж, дахин зурсны дараа буцааж тавина —
    // зөвхөн жинхэнэ "шинэ хуудас руу шилжих" үед л дээш/зүүн тийш буцна (goTop() дуудсан бол).
    var savedScroll=mainEl?mainEl.scrollTop:0;
    var savedTblScrolls={};
    if(mainEl){
      // "sendmonTableWrap" — Илгээх хяналтын хүснэгтийн өөрийн (overflow:auto) гүйлгэлт — disttbl-* хайрцгуудтай
      // адилхан #main дахин зурагдах бүрд шинээр үүсдэг тул, үүнийг мөн хадгалж/сэргээхгүй бол чекложих бүрд
      // (модал хадгалаад render() дуудагдахад) хэрэглэгч хүснэгтийн эхэнд буцаж очих согог гарч байсан.
      var hEls=mainEl.querySelectorAll('[id^="disttbl-"], #sendmonTableWrap');
      for(var i=0;i<hEls.length;i++){ savedTblScrolls[hEls[i].id]={left:hEls[i].scrollLeft,top:hEls[i].scrollTop}; }
    }
    if(navEl)navEl.style.display=loggedIn?'flex':'none';
    if(mainEl)mainEl.style.display=loggedIn?'block':'none';
    if(loggedIn){
      if(lg)lg.style.display='none';
      renderNav();renderMain();autoGrowAllTextareas();fixDistTableStickyOffsets();
      if(mainEl){
        if(S._scrollResetNext){ mainEl.scrollTop=0; S._scrollResetNext=false; }
        else{
          mainEl.scrollTop=savedScroll;
          var hEls2=mainEl.querySelectorAll('[id^="disttbl-"], #sendmonTableWrap');
          for(var j=0;j<hEls2.length;j++){
            var saved=savedTblScrolls[hEls2[j].id];
            if(saved){ hEls2[j].scrollLeft=saved.left; hEls2[j].scrollTop=saved.top; }
          }
        }
      }
    }
    else{if(lg){lg.style.display='flex';lg.innerHTML=renderLoginGate();}}
  } finally {
    S._rendering=false;
    if(S._renderQueued){ S._renderQueued=false; render(); }
  }
}
document.addEventListener('keydown',function(ev){
  var isUndoCombo=(ev.ctrlKey||ev.metaKey)&&!ev.shiftKey&&(ev.key==='z'||ev.key==='Z');
  if(!isUndoCombo)return;
  var ae=document.activeElement;
  var tag=ae?ae.tagName:'';
  var isTextEditCtx=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(ae&&ae.isContentEditable);
  if(isTextEditCtx)return; // тухайн талбарын дотоод (native) буцаах ажиллагаанд саад учруулахгүй
  ev.preventDefault();
  undoLastChange();
});

initDrive();
initSupabase();
render();
</script>
