<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ажлын бүртгэл</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a1020;color:#E7EDF7;height:100vh;overflow:hidden;display:flex}
nav{width:210px;background:#0a1020;display:flex;flex-direction:column;flex-shrink:0;height:100vh;border-right:1px solid #1c2740}
.nh{padding:18px 16px 14px;border-bottom:.5px solid rgba(255,255,255,.07)}
.nt{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:rgba(255,255,255,.9)}
.nd{font-size:11px;color:rgba(255,255,255,.3);margin-top:4px;padding-left:25px}
.ni{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nb{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;border:none;cursor:pointer;font-size:13px;text-align:left;width:100%;background:transparent;color:rgba(255,255,255,.5)}
.nb.active{background:rgba(255,255,255,.1);color:#fff}
.nb i{font-size:15px;color:rgba(255,255,255,.3);flex-shrink:0}
.nb.active i{color:inherit}
.nc{font-size:10px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.55);padding:1px 6px;border-radius:10px;margin-left:auto}
.nf{padding:10px 16px 14px;border-top:.5px solid rgba(255,255,255,.07)}
.nf-txt{font-size:11px;color:rgba(255,255,255,.4);margin-bottom:6px}
.nf-btn{width:100%;text-align:left;background:transparent;border:.5px solid rgba(255,255,255,.2);color:rgba(255,255,255,.5);border-radius:6px;padding:5px 8px;cursor:pointer;font-size:11px;font-family:inherit}
main{flex:1;overflow-y:auto;background:#0a1020}
.page{padding:24px}
.page-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
h2{font-size:20px;font-weight:500;color:#E7EDF7}
.card{background:#0d1526;border:1.25px solid #26395a;border-radius:16px;padding:16px 20px}
.sg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:20px}
.sc{background:#111b2e;border:.5px solid #26395a;border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;border-top-width:3px}
.sc .sn{font-size:26px;font-weight:500;margin:4px 0 2px}
.sc .sl{font-size:10px;color:#8aaace;line-height:1.3}
.two-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px;margin-bottom:16px}
.form-box{background:#111b2e;border:.5px solid #2a3d5c;border-radius:12px;padding:20px;margin-bottom:20px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fb{display:flex;gap:8px;margin-top:10px}
.fl{display:block;font-size:12px;font-weight:500;margin-bottom:4px;color:#8aaace}
.fmb{margin-bottom:10px}
.fcol2{grid-column:1/-1}
.hcrumbs{display:flex;align-items:center;gap:4px;font-size:13px;color:#8aaace;margin-bottom:14px;flex-wrap:wrap}
.hcrumb-seg{cursor:pointer;padding:3px 7px;border-radius:6px}
.hcrumb-seg:hover{background:#1c1f3d;color:#818cf8}
.hcrumb-seg.cur{color:#E7EDF7;font-weight:500;cursor:default}
.hcrumb-seg.cur:hover{background:none}
.hcrumb-sep{color:#2a3d5c}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.hcat-card{background:#111b2e;border:.5px solid #26395a;border-radius:12px;padding:16px;cursor:pointer;transition:.15s;border-left:4px solid var(--accent,#3B82F6)}
.hcat-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.35);transform:translateY(-1px)}
.hcat-idx{font-size:10.5px;color:#5f7292;font-weight:700;letter-spacing:.4px}
.hcat-card h4{font-size:14.5px;margin:6px 0 8px;line-height:1.35;font-weight:500;color:#E7EDF7}
.hcat-meta{display:flex;gap:12px;font-size:12px;color:#8aaace}
.hcat-meta b{color:#E7EDF7}
.hterm-card{background:#111b2e;border:.5px solid #26395a;border-radius:12px;padding:22px;cursor:pointer;text-align:center;transition:.15s}
.hterm-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.35);transform:translateY(-1px)}
.hterm-ic{font-size:28px;margin-bottom:6px}
.hterm-card h4{font-size:14px;margin:0 0 4px;font-weight:500}
.hterm-sub{font-size:12px;color:#8aaace}
.wizard-wrap{margin-bottom:20px}
.wiz-steps{display:flex;gap:0;margin-bottom:20px}
.wiz-step{flex:1;text-align:center;position:relative;cursor:pointer}
.wiz-step .wiz-dot{width:28px;height:28px;border-radius:50%;background:#26395a;color:#5f7292;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;margin:0 auto 6px;transition:.15s}
.wiz-step .wiz-lbl{font-size:11px;color:#8aaace;font-weight:600}
.wiz-step.active .wiz-dot{background:#3B82F6;color:#fff}
.wiz-step.active .wiz-lbl{color:#E7EDF7}
.wiz-step.done .wiz-dot{background:#16A34A;color:#fff}
.wiz-step:not(:last-child)::after{content:'';position:absolute;top:14px;left:60%;width:80%;height:2px;background:#26395a;z-index:0}
.wiz-step.done:not(:last-child)::after{background:#16A34A}
.dist-row{border:.5px solid #26395a;border-radius:8px;padding:10px;margin-bottom:8px;background:#0d1626}


input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{width:100%;padding:8px 10px;border:.5px solid #2a3d5c;border-radius:8px;font-size:13px;background:#0d1626;color:#E7EDF7;font-family:inherit;outline:none}
textarea{resize:vertical}
.file-zone{grid-column:1/-1;border:1.5px dashed #2a3d5c;border-radius:8px;padding:14px;text-align:center;cursor:pointer;transition:.2s;margin-bottom:10px}
.file-zone:hover{border-color:#22d3ee;background:#0b2333}
.file-zone input[type=file]{display:none}
.file-list{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.file-item{display:flex;align-items:center;gap:8px;background:#0d1626;border:.5px solid #26395a;border-radius:6px;padding:7px 10px;font-size:12px}
.file-item .fi-name{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .fi-sz{color:#5f7292;flex-shrink:0}
.file-item .fi-rm{background:transparent;border:none;cursor:pointer;color:#5f7292;font-size:14px;padding:0 2px}
.file-badge{font-size:11px;color:#22d3ee;cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.file-badge:hover{text-decoration:underline}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:none;font-family:inherit}
.btn-p{background:rgba(0,212,255,.15);color:#00d4ff;border:1.25px solid rgba(0,212,255,.4)}
.btn-g{background:transparent;border:.5px solid #2a3d5c;color:#E7EDF7}
.btn-ai{background:transparent;border:.5px solid #DB2777;color:#DB2777}
.btn-cal{font-size:11px;padding:4px 10px;background:#0b2333;color:#38bdf8;border:.5px solid #0ea5e9;border-radius:8px;cursor:pointer;font-family:inherit}
.btn-del{padding:4px 8px;border:.5px solid #26395a;border-radius:8px;background:transparent;color:#5f7292;cursor:pointer;font-size:13px;font-family:inherit}
.ic{background:#111b2e;border:.5px solid #26395a;border-radius:12px;padding:13px 16px;margin-bottom:8px}
.ic-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ic-main{flex:1;min-width:0}
.ic-title{font-size:15px;font-weight:500;color:#E7EDF7}
.ic-meta{font-size:12px;color:#8aaace;display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;margin-bottom:4px}
.ic-body{font-size:12px;color:#8aaace;line-height:1.5}
.ic-acts{display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.bdg{font-size:11px;padding:2px 8px;border-radius:20px}
.bdg-num{color:#8aaace;background:#16213a;border:.5px solid #26395a}
.bdg-ok{color:#34d399;background:#0f2a22}
.bdg-warn{color:#fbbf24;background:#2e2410}
.bdg-info{color:#00d4ff;background:#0d2633}
.bdg-rc{color:#fff;background:#22d3ee}
.tab2-btn{padding:8px 18px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;border:1.25px solid #26395a;background:transparent;color:#8aaace;font-family:inherit}
.tab2-btn.active{background:rgba(0,212,255,.15);border:1.25px solid rgba(0,212,255,.4);color:#00d4ff}
.dl-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:.5px solid #1c2740;gap:8px}
.dl-row:last-child{border-bottom:none}
.dl-t{font-size:11px;color:#8aaace}
.dl-n{font-size:13px;color:#E7EDF7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urg-bdg{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;white-space:nowrap}
.chat-page{display:flex;flex-direction:column;height:100vh}
.chat-head{flex-shrink:0;padding:16px 24px 0}
.chat-hd-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.chat-qs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chat-q{font-size:11px;padding:5px 12px;border:.5px solid #26395a;border-radius:20px;background:#0d1626;cursor:pointer;font-family:inherit;color:#E7EDF7}
.chat-msgs{flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:82%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.7;white-space:pre-wrap}
.msg-u{background:#0e5a73;color:#fff;align-self:flex-end}
.msg-a{background:#111b2e;color:#E7EDF7;border:.5px solid #26395a;align-self:flex-start}
.chat-inp{flex-shrink:0;padding:12px 24px 20px;border-top:.5px solid #26395a}
.chat-inp-row{display:flex;gap:8px}
.banner{background:#2e2410;border:.5px solid #92600e;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:#f59e0b;display:flex;align-items:center;gap:8px}
.rc-card{border-left:3px solid #22d3ee}
.prev-box{background:#0d2633;border:.5px solid #0891b2;border-radius:8px;padding:10px 14px;margin-top:6px;font-size:13px;grid-column:1/-1}
.empty{text-align:center;padding:60px 20px;color:#5f7292;background:#111b2e;border:.5px solid #26395a;border-radius:12px}
.empty i{font-size:36px;display:block;margin-bottom:10px}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100}
.mbox{background:#111b2e;border-radius:14px;padding:24px;width:500px;max-width:94vw;max-height:88vh;overflow-y:auto;border:.5px solid #26395a}
.mbox h3{font-size:16px;font-weight:500;margin-bottom:14px;color:#E7EDF7}
.mbox p{font-size:13px;color:#8aaace;margin-bottom:12px;line-height:1.6}
.qb{text-align:left;padding:8px 12px;border:.5px solid #26395a;border-radius:8px;background:#0d1626;cursor:pointer;font-size:12px;color:#E7EDF7;line-height:1.4;width:100%;margin-bottom:6px;font-family:inherit}
.sug-card{border:.5px solid #26395a;border-radius:10px;padding:13px;margin-bottom:8px}
.sug-card.accepted{opacity:.45;pointer-events:none}
.file-viewer{font-size:13px;line-height:1.7;color:#c3d0e4;white-space:pre-wrap;max-height:280px;overflow-y:auto;background:#0d1626;border:.5px solid #26395a;padding:10px 12px;border-radius:8px;margin-top:8px}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:#26395a;border-radius:10px;overflow:hidden;}
.cal-head{background:#111b2e;padding:8px;text-align:center;font-size:12px;font-weight:500;color:#8aaace;}
.cal-cell{background:#0d1626;padding:6px;min-height:80px;display:flex;flex-direction:column;gap:2px;}
.cal-cell.cal-empty{background:#0a1020;}
.cal-cell.cal-today{background:#0d2633;}
.cal-day{font-size:13px;font-weight:500;color:#E7EDF7;margin-bottom:2px;}
.cal-today .cal-day{color:#00d4ff;font-weight:700;}
.cal-ev{font-size:10px;padding:1px 4px;border-radius:3px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#loginGate{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#16305c,#0a1020 60%,#050810)}
.login-card{width:340px;max-width:90vw;background:#111b2e;border:.5px solid #26395a;border-radius:16px;padding:32px 28px;box-shadow:0 20px 60px -20px rgba(0,0,0,.7)}
.login-card h2{margin:10px 0 4px;font-size:18px;text-align:center;color:#E7EDF7}
.login-sub{text-align:center;font-size:12.5px;color:#8aaace;margin-bottom:18px}
.login-ic{width:52px;height:52px;border-radius:14px;background:rgba(0,212,255,.15);border:1.25px solid rgba(0,212,255,.4);color:#00d4ff;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto}
.login-card select,.login-card input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid #2a3d5c;font-size:13.5px;font-family:inherit;margin-bottom:12px;box-sizing:border-box;background:#0d1626;color:#E7EDF7}
.login-divider{display:flex;align-items:center;text-align:center;color:#5b7699;font-size:11.5px;margin:14px 0 10px}
.login-divider::before,.login-divider::after{content:'';flex:1;border-bottom:1px solid #26395a}
.login-divider span{padding:0 10px}
.admin-popover{margin-top:10px;padding:14px;background:#0d1626;border:1px solid #2a3d5c;border-radius:10px;animation:fadeIn .15s ease}
.admin-popover input{margin-bottom:10px}
</style>
</head>
<body>
<div id="loginGate"></div>
<nav>
  <div class="nh">
    <div class="nt"><i class="ti ti-building-community" style="color:#60A5FA"></i>Ажлын бүртгэл</div>
    <div class="nd" id="nav-date"></div>
  </div>
  <div class="ni" id="nav-items"></div>
  <div class="nf">
    <div class="nf-txt" id="nav-user" style="font-weight:600;margin-bottom:2px"></div>
    <div class="nf-txt" id="nav-total"></div>
    <div id="sb-status" style="font-size:11px;color:rgba(255,255,255,.4);margin-bottom:4px"></div>
    <div id="drive-status" style="font-size:11px;color:rgba(255,255,255,.4);margin-bottom:6px"></div>
    <button class="nf-btn" onclick="downloadBackupFile()" title="Одоогийн бүх өгөгдлийг компьютерт JSON файлаар татаж, Drive-аас тусдаа өөрөө хадгална" style="margin-bottom:6px;background:#0F9D58"><i class="ti ti-download" style="font-size:11px"></i> Нөөц татах</button>
    <button class="nf-btn" id="undo-btn" onclick="undoLastChange()" disabled title="Сүүлийн өөрчлөлтийг буцаах (Ctrl+Z)" style="margin-bottom:6px"><i class="ti ti-arrow-back-up" style="font-size:11px"></i> Буцаах</button>
    <button class="nf-btn" onclick="logout()" style="margin-bottom:6px"><i class="ti ti-logout" style="font-size:11px"></i> Гарах</button>
    <button class="nf-btn" onclick="openSettings()"><i class="ti ti-key" style="font-size:11px"></i> AI тохиргоо (API түлхүүр)</button>
  </div>
</nav>
<main id="main"></main>
<div id="modal"></div>

<script>

йцэтгэх ажиллагаа явуулж байна.  Шийдвэр гүйцэтгэх ажиллагаа явуулж төлбөр төлөгч “Петрочайна дачин тамсаг” ХХК-ийн өмчлөлийн Баянзүрх дүүрэгт байрлах орон сууц, конторын зориулалттай бусдын үүргийн гүйцэтгэлд барьцаалагдаагүй 2 үл хөдлөх эд хөрөнгийг 2024 оны 08 дугаар сарын 16-ны өдөр хурааж, үнэлгээ тогтоолгоход нийт 3.0 тэрбум төгрөгөөр үнэлэгдэж, төлбөр төлөгчөөс хөрөнгийн үнэлгээг эс зөвшөөрч шүүхэд нэхэмжлэл гаргасныг Баянзүрх дүүргийн Иргэний хэргийн анхан шатны шүүхээс хэрэгсэхгүй болгож, хөрөнгийг 2025 оны 07 дугаар сарын 04-ний өдрийн анхны Албадан дуудлага худалдаагаар үнийн санал ирээгүй тул хоёрдох албадан дуудлага худалдаанд оруулах явцад талуудаас гаргасан хүсэлт, гомдлын дагуу ахлах шийдвэр гүйцэтгэгчийн 2025 оны 07 дугаар сарын 23-ны өдрийн 25-08/395 тогтоолоор ШШГТХ-ийн 27.2.5 дахь хэсэгт зааснаар шийдвэр гүйцэтгэх ажиллагааг түдгэлзүүлсэн.  Иргэний хэрэг эцэслэн шийдвэрлэгдсэн тул үл хөдлөх эд хөрөнгийн анхны албадан дуудлага худалдаагаар худалдан борлогдоогүй, \"Петройчайна дачин тамсаг” ХХК-ийн өмчлөлийн эрхийн улсын Ү-2204014974 дугаарт бүртгэлтэй, Баянзүрх дүүргийн 30 дугаар хороо, Доржийн гудамж, 14 дүгээр барилга, 860 м.кв талбайтай орон сууц, конторын зориулалттай үл хөдлөх хөрөнгийг Иргэний хуулийн 177 дугаар зүйлийн 177.4-д заасны дагуу шинжээчийн тогтоосон үнэ 2,685,511,222 төгрөгийн 50 хувь болох 1,342,755,711 төгрөгөөр, эрхийн улсын Ү-2204020131 дугаарт бүртгэлтэй, Баянзүрх дүүргийн 30 дугаар хороо, Доржийн гудамж, 18/2 дугаар байрны 6 тоот 99 м.кв талбайтай орон сууцны зориулалттай үл хөдлөх эд хөрөнгийг шинжээчийн тогтоосон үнэ 324,256,047 төгрөгийн 50 хувь болох 162,128,024 төгрөгөөр тус тус дуудлага худалдааны дуудах доод үнийг тогтоон, 2026 оны 02 дугаар сарын 06-ны өдөр хоёр дахь албадан дуудлага худалдааг зохион байгуулсан боловч худалдан борлогдоогүй.   Худалдан борлогдоогүй 860 м.кв талбайтай орон сууц, конторын зориулалттай үл хөдлөх хөрөнгийг дарааллын 1 дүгээрт бүртгэлтэй Матад суманд, 18/2 дугаар байрны 6 тоот 99 м.кв тал const DEPT_NAMES={'ДХХ':'Дотоод хяналтын хэлтэс','ТДАХ':'Төлөвлөлт, дотоод ажлын хэлтэс','ЦБДШХ':'Цахим бүртгэл, дүн шинжилгээний хэлтэс','САА':'Санхүү, аж ахуй','Бусад':'Бусад'};
// ── ГАЗАР (орон нутгийн шийдвэр гүйцэтгэх газрууд) — Хариуцах нэгжийн жагсаалтад "Хэлтэс"-үүдийн хажуугаар
// Админ-аас нэмж болдог, тоо нь урьдчилан тодорхойгүй хоёр дахь бүлэг. Газрын түлхүүр нь үргэлж "gazar_" угтвартай
// байснаар өгөгдлийн бусад хэсэгт (Хэлтэс код) огт давхцахгүй.
function getGazarList(){ return (S.data&&S.data.gazarList)||[]; }
function isGazarDept(code){ return !!(code&&String(code).indexOf('gazar_')===0); }
function deptDisplayName(code){
  if(!code)return '';
  if(DEPT_NAMES[code])return DEPT_NAMES[code];
  var g=getGazarList().find(function(x){return x.key===code;});
  return g?g.name:code;
}
// Газрын алба хаагчийн нэр хараахан бүртгэгдээгүй үед зөвхөн албан тушаалын ангилалаар нь ("Ахлах" / "Шийдвэр
// гүйцэтгэгч") хариуцуулж болохоор — жинхэнэ, нэртэй алба хаагчийн бичлэг биш тул ердийн staffId (тоон дугаар)-ийн
// оронд "pos:..." гэсэн тэмдэгт мөр хэлбэрээр хадгална.
var POSITION_ROLES=[{key:'pos:ahlah',label:'Ахлах'},{key:'pos:shguitgegch',label:'Шийдвэр гүйцэтгэгч'}];
function isPositionRole(staffId){ return !!(staffId&&String(staffId).indexOf('pos:')===0); }
function positionRoleLabel(staffId){ var r=POSITION_ROLES.find(function(p){return p.key===staffId;}); return r?r.label:''; }
// Хэлтэс (үндсэн 4) болон Газар (Админ-аас нэмэгдсэн) хоёрыг нэг dropdown дотор 2 бүлэглэлээр ("Хэлтэс" /
// "Газар") харуулах нийтлэг сонголтын HTML — өмнө нь энэ жагсаалтыг ~13 өөр газарт тус тусад нь давхардуулж
// бичдэг байсан тул Газрыг зөвхөн энд нэг л удаа нэмэхэд хангалттай болгов.
function allDeptCodes(){ return ['ДХХ','ТДАХ','ЦБДШХ','САА'].concat(getGazarList().map(function(g){return g.key;})); }
// Тайлбар: анх энэ dropdown-ыг "Хэлтэс"/"Газар" гэсэн 2 бүлэгт ялгахдаа native <optgroup> ашигладаг байсан ч,
// Chrome-д <optgroup>-ийн дотор орсон <option>-ууд нь <select>-д өгсөн өнгөний (color) CSS-ийг залгамжлахгүй,
// dropdown-ыг нээхэд саарал/бүдэг (унтарсан мэт) харагддаг нь тогтоогдов (тухайн browser-ийн native квирк —
// хуудасны CSS-ээр засах боломжгүй). Иймд <optgroup>-ийн оронд энгийн, сонголт хийх боломжгүй ("disabled")
// header мөр ашиглаж бүлэглэнэ — ингэснээр бодит сонголт хийгдэх <option> бүр өмнөх шигээ хэвийн (бүдэггүй)
// харагдана.
function deptSelectOptionsHtml(selectedVal,emptyLabel){
  var baseDepts=['ДХХ','ТДАХ','ЦБДШХ','САА'];
  var gz=getGazarList();
  var html='<option value="">'+esc(emptyLabel||'— Хэлтэс —')+'</option>';
  if(gz.length)html+='<option disabled>── Хэлтэс ──</option>';
  html+=baseDepts.map(function(d){return '<option value="'+d+'"'+(selectedVal===d?' selected':'')+'>'+esc(DEPT_NAMES[d]||d)+'</option>';}).join('');
  if(gz.length){
    html+='<option disabled>── Газар ──</option>';
    html+=gz.map(function(g){return '<option value="'+esc(g.key)+'"'+(selectedVal===g.key?' selected':'')+'>'+esc(g.name)+'</option>';}).join('');
  }
  return html;
}
// Хэлтэс сонгогдсон бол ердийн нэртэй алба хаагчийн жагсаалт (staffOptionsHtml), харин Газар сонгогдсон бол
// (тухайн Газрын алба хаагчид нэр дэвшин бүртгэгдээгүй тул) зөвхөн "Ахлах"/"Шийдвэр гүйцэтгэгч" гэсэн албан
// тушаалын ангилал сонгуулна.
function staffOrPositionOptionsHtml(dept,selId){
  if(isGazarDept(dept)){
    var opts='<option value="">— Албан тушаал сонгох —</option>';
    opts+=POSITION_ROLES.map(function(p){return '<option value="'+p.key+'"'+(selId===p.key?' selected':'')+'>'+esc(p.label)+'</option>';}).join('');
    return opts;
  }
  return staffOptionsHtml(dept,selId);
}
// Дэлгэрэнгүй харагдац дээр хариуцагчийн нэрийг харуулахдаа, эхлээд албан тушаалын код эсэхийг шалгаад, эс
// бол ердийн нэртэй алба хаагчийн бичлэгээс хайна.
function staffOrPositionName(staffId){
  if(!staffId)return '';
  if(isPositionRole(staffId))return positionRoleLabel(staffId);
  var staffList=(S.data.staff||STAFF_LIST);
  var s=staffList.find(function(x){return String(x.id)===String(staffId);});
  return s?s.name:'';
}
// "Хариуцах алба хаагч" dropdown-ын утгыг staffId талбарт хадгалахад ашиглана: жинхэнэ алба хаагч сонгосон бол
// тоон дугаар руу хөрвүүлнэ (parseInt), харин Газрын "Ахлах"/"Шийдвэр гүйцэтгэгч" гэсэн албан тушаал сонгосон
// бол "pos:..." тэмдэгт мөрийг АЛГА хэвээр (хөрвүүлэлгүй) хадгална — parseInt хийвэл NaN болно.
function parseStaffIdValue(v){
  if(!v)return '';
  if(String(v).indexOf('pos:')===0)return v;
  var n=parseInt(v,10);

// ===== ТӨЛӨВЛӨГӨӨНИЙ ХЯНАЛТ — логик =====
function loadPlanTrack(){try{return JSON.parse(localStorage.getItem('ajl_plantrack')||'{}');}catch(e){return{};}}
function savePlanTrack(){localStorage.setItem('ajl_plantrack',JSON.stringify(S.planTrack));try{writeToDrive();}catch(e){}}
function getTrack(id){return S.planTrack[id]||{done:false,staffId:null};}
function togglePlanDone(id){const t=getTrack(id);t.done=!t.done;S.planTrack[id]=t;savePlanTrack();render();}
function assignPlanStaff(id,staffId){const t=getTrack(id);t.staffId=staffId?parseInt(staffId):null;S.planTrack[id]=t;savePlanTrack();render();}

function planCatOf(planNum){const pm=PLAN_META.find(p=>p.num===planNum);return pm?pm.cat:'';}
function planColorOf(planNum){const pm=PLAN_META.find(p=>p.num===planNum);return pm?('#'+pm.color):'#5f7292';}
function planShortOf(planNum){const pm=PLAN_META.find(p=>p.num===planNum);return pm?pm.short:'';}
function staffById(id){return (S.data.staff||STAFF_LIST).find(s=>s.id===id);}

const MONTHS_G=['1-р сар','2-р сар','3-р сар','4-р сар','5-р сар','6-р сар','7-р сар','8-р сар','9-р сар','10-р сар','11-р сар','12-р сар'];

function extractFullField(full,label){
  var f=(full||[]).find(function(x){return x.label===label;});
  return f?(f.value||''):'';
}
function extractPlanDate(item){
  const text=(item.deadline||'')+' '+(item.content||'')+' '+(item.fulfillment||'');
  let m=text.match(/(20\d{2})[.\-](\d{1,2})[.\-](\d{1,2})/);
  if(m){const d=new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3]));if(!isNaN(d))return{date:d,precision:'day'};}
  m=text.match(/(20\d{2})\s*оны?\s*(\d{1,2})\s*дугаар\s*сарын?\s*(\d{1,2})/);
  if(m){const d=new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3]));if(!isNaN(d))return{date:d,precision:'day'};}
  m=text.match(/(20\d{2})\s*оны?\s*(\d{1,2})\s*дугаар\s*сар/);
  if(m){const d=new Date(parseInt(m[1]),parseInt(m[2])-1,15);if(!isNaN(d))return{date:d,precision:'month'};}
  const dl=(item.deadline||'');
  m=dl.match(/(\d)\s*(?:-р|\s*дугаар)?\s*улирал/i)||dl.match(/^(I|II|III|IV)\s*улирал/i);
  if(m){
    const qmap={'1':2,'i':2,'2':5,'ii':5,'3':8,'iii':8,'4':11,'iv':11};
    const key=m[1].toLowerCase();
    const mon=qmap[key];
    if(mon!==undefined){const d=new Date(2026,mon,20);return{date:d,precision:'quarter'};}
  }
  m=dl.match(/^(\d{1,2})\s*[-–]\s*(\d{1,2})\s*дугаар\s*сар/);
  if(m){const d=new Date(2026,parseInt(m[1])-1,15);return{date:d,precision:'month'};}
  m=dl.match(/^(\d{1,2})\s*,\s*(\d{1,2})\s*дугаар\s*сар/);
  if(m){const d=new Date(2026,parseInt(m[1])-1,15);return{date:d,precision:'month'};}
  return null;
}

function filteredPlanItems(){
  return PLAN_ITEMS.filter(it=>{
    if(S.planFilterCat&&planCatOf(it.planNum)!==S.planFilterCat)return false;
    if(S.planFilterPlan&&it.planNum!==parseInt(S.planFilterPlan))return false;
    const tr=getTrack(it.id);
    if(S.planFilterStaff){
      if(S.planFilterStaff==='none'){if(tr.staffId)return false;}
      else if(tr.staffId!==parseInt(S.planFilterStaff))return false;
    }
    if(S.planOnlyUndone&&tr.done)return false;
    return true;
  });
}

function renderPlanCalendar(){
  const y=S.calYear,m=S.calMonth;
  const WD=['Да','Мя','Лх','Пү','Ба','Бя','Ня'];
  let firstDay=new Date(y,m,1).getDay();firstDay=(firstDay+6)%7;
  const daysInMonth=new Date(y,m+1,0).getDate();
  const today=new Date();today.setHours(0,0,0,0);
  const items=filteredPlanItems();
  const evMap={};
  const unscheduled=[];
  items.forEach(it=>{
    const dd=extractPlanDate(it);
    if(dd&&dd.date.getFullYear()===y&&dd.date.getMonth()===m){
      const day=dd.date.getDate();
      (evMap[day]=evMap[day]||[]).push({item:it,precision:dd.precision});
    } else if(!dd){
      unscheduled.push(it);
    }
  });
  let cells='';let col=0;
  for(let i=0;i<firstDay;i++){cells+='<div class="cal-cell cal-empty"></div>';col++;}
  for(let d=1;d<=daysInMonth;d++){
    const dt=new Date(y,m,d);dt.setHours(0,0,0,0);
    const isToday=dt.getTime()===today.getTime();
    const evs=evMap[d]||[];
    const evHtml=evs.slice(0,3).map(e=>{const c=planColorOf(e.item.planNum);const tr=getTrack(e.item.id);const strike=tr.done?'text-decoration:line-through;opacity:.5;':'';return '<div class="cal-ev" style="background:'+c+'20;color:'+c+';border-left:2px solid '+c+';cursor:pointer;'+strike+'" onclick="openPlanModal('+e.item.id+')" title="'+esc(e.item.content.slice(0,80))+'">'+esc(e.item.content.slice(0,26))+'</div>';}).join('');
    const more=evs.length>3?'<div class="cal-ev" style="color:#5f7292">+'+(evs.length-3)+' дахин</div>':'';
    cells+='<div class="cal-cell'+(isToday?' cal-today':'')+'"><div class="cal-day">'+d+'</div>'+evHtml+more+'</div>';
    col++;
  }
  while(col%7!==0){cells+='<div class="cal-cell cal-empty"></div>';col++;}
  const unschedHtml=unscheduled.length?`<div class="card" style="margin-top:14px">
    <h3 style="font-size:13px;font-weight:500;margin-bottom:10px;color:#8aaace"><i class="ti ti-calendar-off" style="margin-right:6px"></i>Тодорхой огноогүй заалтууд (${unscheduled.length}) — хугацаа нь "жилдээ", "тогтмол", "чөлөөтэй" гэх мэт чөлөөтэй бичигдсэн тул хуанлид харагдахгүй байна</h3>
    <div style="display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto">
      ${unscheduled.slice(0,60).map(it=>{const c=planColorOf(it.planNum);const tr=getTrack(it.id);return `<div style="display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 8px;border-radius:6px;background:#0d1626;cursor:pointer${tr.done?';opacity:.5':''}" onclick="openPlanModal(${it.id})"><span style="width:8px;height:8px;border-radius:50%;background:${c};flex-shrink:0"></span><span style="color:#8aaace;flex-shrink:0">${esc(it.deadline||'—')}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.content.slice(0,90))}</span></div>`;}).join('')}
    </div>
  </div>`:'';
  return `<div class="page-hd" style="margin-top:0"><div style="display:flex;align-items:center;gap:8px">
      <button class="btn btn-g" onclick="S.calMonth--;if(S.calMonth<0){S.calMonth=11;S.calYear--;}render()">‹</button>
      <span style="font-weight:500;font-size:15px">${y} он &nbsp;${MONTHS_G[m]}</span>
      <button class="btn btn-g" onclick="S.calMonth++;if(S.calMonth>11){S.calMonth=0;S.calYear++;}render()">›</button>
    </div></div>
    <div class="cal-grid">${WD.map(d=>'<div class="cal-head">'+d+'</div>').join('')}${cells}</div>
    ${unschedHtml}`;
}

function monGroupKey(it){ return it._source==='letter'?('letter_'+it._letterId):('legacy_'+(it.planNum||it._label||'x')); }
function toggleMonGroupOpen(key){ S.monGroupOpen=S.monGroupOpen||{}; S.monGroupOpen[key]=!S.monGroupOpen[key]; render(); }

// Админ бүх баримт бичгийн нэгтгэгчийг, харин хэлтсийн дарга зөвхөн ӨӨРИЙН хэлтсийн албан хаагчаар
// нэгтгэгчийг сольж болно (доод талд eligibleStaff-аар хязгаарлагдана) — тухайн албан хаагч ямар нэг
// шалтгаанаар байхгүй болсон үед хэлтсийн дарга өөрөө шуурхай сольж чадах учиртай.
function canSwapLegacyConsolidator(){

}
// Нэгтгэгч сонгох UI-д Хадгалах/Болих гэсэн тодорхой батламж шаардлагатай тул сонголтыг шууд
// хадгалахгүй, эхлээд ноорог (S.legacyConsolidatorDraft) дээр хадгалж, зөвхөн "Хадгалах" дарахад
// setLegacyDocConsolidator-аар бодитоор бичигдэнэ; "Болих" бол ноорог хаяж хуучин утга хэвээр үлдэнэ.
function startLegacyConsolidatorEdit(key,curVal){

  S.legacyConsolidatorDraft=S.legacyConsolidatorDraft||{};
  S.legacyConsolidatorDraft[key]=curVal||'';

function saveLegacyConsolidatorDraft(planNum,key){
  var val=(S.legacyConsolidatorDraft&&S.legacyConsolidatorDraft[key])||'';

function cancelLegacyConsolidatorEdit(key){

function renderMonGroupedByDoc(items){
  if(items.length===0)return '<div class="card"><p style="font-size:13px;color:#5f7292;padding:4px">Одоогоор шүүлтэд тохирох заалт алга</p></div>';
  S.monGroupOpen=S.monGroupOpen||{};
  var staffList=(S.data.staff||STAFF_LIST);
  var meMon=currentStaffObj();
  var legacyCons=S.data.legacyConsolidators||{};
  var byKey={}, order=[];
  items.forEach(function(it){
    var key=monGroupKey(it);
    if(!byKey[key]){
      var parentLetter=(it._source==='letter'&&it._letterId)?findLetter(it._letterId):null;
      // Ирсэн бичгийн нэгтгэгч нь тухайн бичгийн бүртгэлээс, харин хуучин (2026 оны нэгтгэсэн) төлөвлөгөөний
      // баримт бичгийн нэгтгэгч нь S.data.legacyConsolidators-оос (planNum-ээр) — доор "setLegacyDocConsolidator".
      var consolidatorId=parentLetter?(parentLetter.consolidatorId||''):(legacyCons[it.planNum]||'');
      var consolidatorObj=consolidatorId?staffList.find(function(s){return String(s.id)===String(consolidatorId);}):null;
      byKey[key]={key:key,label:it._label,from:it._from,docType:it._docType,
        letterId:it._source==='letter'?it._letterId:null,
        planNum:it._source==='legacy'?(it.planNum||null):null,
        groupCat:parentLetter?(parentLetter.groupCat||''):(it.planNum!=null?planCatOf(it.planNum):''),
        date:parentLetter?(parentLetter.date||''):'',
        deadline:parentLetter?(parentLetter.deadline||''):'',
        consolidatorId:consolidatorObj?String(consolidatorObj.id):'',
        consolidatorName:consolidatorObj?consolidatorObj.name:'',
        items:[]};
      order.push(byKey[key]);
    }
    byKey[key].items.push(it);
  });
  // Хамгийн эхэлж бүртгэгдсэн (хамгийн эрт орсон) баримт бичиг 1-р дугаартай — эрэмбэлээгүй үед энэ дараалал хэвээр
  var seqIndex={}; order.forEach(function(g,i){seqIndex[g.key]=i+1;});
  // Явц (%)-ыг шүүлтүүр болон харуулалтад хоёуланд нь хэрэгтэй тул нэг л удаа тооцоод group дээр хадгална.
  order.forEach(function(g){
    g._criteriaCount=g.items.length;
    g._doneF=g.items.filter(function(it){return it.fulfillment;}).length;
    g._pctDone=g._criteriaCount?Math.round(g._doneF/g._criteriaCount*100):0;

  var catGroups=getCatGroups();
  var qTitle=(S.monDocSearchTitle||'').trim().toLowerCase();

  var consolidatorMap={};

  var consolidatorList=Object.keys(consolidatorMap).map(function(id){return {id:id,name:consolidatorMap[id]};}).sort(function(a,b){return (a.name||'').localeCompare(b.name||'','mn');});
  var filtered=order.filter(function(g){
    if(filterGroup&&(g.groupCat||'')!==filterGroup)return false;
    if(filterType&&(g.docType||'')!==filterType)return false;

let driveDirHandle = null;

async function openIDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('ajl_db', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('handles');
    req.onsuccess = e => res(e.target.result);
    req.onerror = rej;
  });
}
async function saveDirHandle(h) {
  const db = await openIDB();
  return new Promise(res => { const tx = db.transaction('handles','readwrite'); tx.objectStore('handles').put(h,'dir'); tx.oncomplete=res; });
}
async function getDirHandle() {
  try {
    const db = await openIDB();
    return new Promise(res => { const tx = db.transaction('handles','readonly'); const r=tx.objectStore('handles').get('dir'); r.onsuccess=e=>res(e.target.result||null); r.onerror=()=>res(null); });
  } catch { return null; }
}
async function connectDrive() {

async function readDriveBackup() {
  if(!driveDirHandle) return null;

    const text = await file.text();

  } catch(e) { return null; }
}

function subscribeSupabaseRealtime(){
  if(!sbClient) return;
  try{
    sbClient.channel('app_data_changes')
      .on('postgres_changes', {event:'UPDATE', schema:'public', table:'app_data', filter:'id=eq.main'}, function(payload){
        var newRow = payload.new;
        if(!newRow) return;
        if(newRow.updated_at === S._sbLastUpdatedAt) return; // энэ tab өөрөө хийсэн өөрчлөлт — зүгээр
        if(Date.now() < S._pushGraceUntil){

          // байх магадлал өндөр (HTTP хариу ирэхээс өмнө websocket мэдэгдэл түрүүлж ирэх race). Худал
          // анхааруулга гаргахгүйгээр зүгээр л шинэ timestamp-г чимээгүй хүлээж авъя.
          S._sbLastUpdatedAt = newRow.updated_at;

}

function arrayBufferToBase64(buf){
  var bytes=new Uint8Array(buf),binary='',chunk=0x8000;
  for(var i=0;i<bytes.length;i+=chunk){binary+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));}
  return btoa(binary);
}

  // гүй/буруу content-type-той хүсэлтийг татгалзаж, файлын бодит хэмжээтэй огт холбоогүй "алдаа" өгч болзошгүй.
  var contentType=file.type||FILE_MIME_BY_EXT[safeName.split('.').pop().toLowerCase()]||'application/octet-stream';
  // Түр зуурын сүлжээний саатлаас болж ганц удаагийн оролдлого амжилтгүй болоод, файл бодит хэмжээгээрээ
  // огт том биш байсан ч "алдаа" гэж буцаж, дараа нь хэрэглэгчид зөвхөн буруу таамаг ("хэмжээ том байж
  // болзошгүй") л харагддаг байсан тохиолдол цөөнгүй тул — 1 удаа автоматаар дахин оролдоно.
  for(var attempt=0;attempt<2;attempt++){
    try{
      var up=await sbClient.storage.from(FILE_STORAGE_BUCKET).upload(path,file,{cacheControl:'3600',upsert:false,contentType:contentType});
      if(!up.error){
        var pub=sbClient.storage.from(FILE_STORAGE_BUCKET).getPublicUrl(path);
        return {storagePath:path,storageUrl:(pub&&pub.data?pub.data.publicUrl:'')};
      }
    }catch(e){}
    if(attempt===0)await new Promise(function(r){setTimeout(r,800);});
  }
  return {error:'failed'};
}
// Хавсралт файлын анхны хувь (storageUrl) хадгалагдаагүй байгаа шалтгааныг ТОДОРХОЙ харуулна — өмнө нь
// шалтгаанаас үл хамааран "25MB-с том байж болзошгүй" гэсэн ГАНЦ л таамаглалыг үргэлж эхэнд нь бичдэг байсан
// тул бодит шалтгаан (жиш: сүлжээ тасарсан, Storage руу илгээх үед алдаа гарсан) далд үлдэж, хэрэглэгч
// "хэмжээ том биш байгаа юм чинь яагаад ингэж бичээд байгаа юм" гэж эргэлздэг байв. Одоо readOneFile() үед
// хадгалсан f.storageError утгыг (toolarge/offline/failed) шалгаж, яг тохирсон тайлбарыг л буцаана.
function storageErrorMessage(f){
  var err=f&&f.storageError;
  if(err==='toolarge')return 'Анхны файл хадгалагдаагүй — энэ файл 25MB-с том тул зөвхөн олдсон текстийг харуулж байна.';
  if(err==='offline')return 'Анхны файл хадгалагдаагүй — оруулах үед сервертэй холбогдоогүй (offline) байсан тул зөвхөн олдсон текстийг харуулж байна. Файлыг дахин хавсаргаж үзнэ үү.';
  if(err==='failed')return 'Анхны файл хадгалагдаагүй — файлыг серверт байршуулах үед алдаа гарсан (сүлжээний саатал байж болзошгүй, хэмжээтэй холбоогүй). Файлыг дахин хавсаргаж үзнэ үү.';
  return 'Анхны файл хадгалагдаагүй тул зөвхөн олдсон текстийг харуулж байна (энэ боломж нэмэгдэхээс өмнө бүртгэгдсэн байж магадгүй).';
}
// Файлын текстийг задалж (AI ангилагч, хайлт г.м-д), зэрэгцээд Storage-т байршуулж, богино
// холбоосыг нь нэгтгэн буцаана. Дуудагч бүх газарт (Гараар нэмэх, AI-аар нэгэн зэрэг оруулах,
// аль хэдийн бүртгэгдсэн бичигт файл нэмэх) энэ ганц функцээр дамждаг тул энд нэг л удаа
// найдвартай зассан нь хаа сайгүй ажиллана.
async function readOneFile(file){
  var extracted=await extractFileData(file);
  var uploaded=await uploadFileToStorage(file);
  if(uploaded&&!uploaded.error){
    extracted.storagePath=uploaded.storagePath;
    extracted.storageUrl=uploaded.storageUrl;
  }else{
    extracted.storageError=(uploaded&&uploaded.error)||'failed';
  }
  return extracted;
}
async function extractFileData(file){
  const ext=file.name.split('.').pop().toLowerCase();

  if(ext==='txt'){
    return new Promise(res=>{
      const r=new FileReader();
      r.onload=e=>res({name:file.name,size:file.size,ext:'txt',text:e.target.result});
      r.readAsText(file,'UTF-8');
    });
  }

  if(ext==='pdf'){
    return new Promise(function(res){
      var reader=new FileReader();
      reader.onload=async function(e){
        try{
          if(!window.pdfjsLib){
            // Fallback: extract text from PDF binary using simple string extraction
            var bytes=new Uint8Array(e.target.result);
            var raw='';
            for(var bi=0;bi<bytes.length;bi++){if(bytes[bi]>31&&bytes[bi]<127)raw+=String.fromCharCode(bytes[bi]);}
            // Extract readable Mongolian-like text segments
            var matches=raw.match(/\(([^\)]{3,200})\)/g)||[];
            var text=matches.map(function(m){return m.slice(1,-1);}).filter(function(s){return s.trim().length>2;}).join(' ');
            if(text.length>50){res({name:file.name,size:file.size,ext:'pdf',text:text});return;}
            res({name:file.name,size:file.size,ext:'pdf',text:'[PDF — pdfjsLib ачаалагдаагүй байна. start.bat-аар нээнэ үү]'});return;
          }
          pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
          var pdf=await pdfjsLib.getDocument({data:new Uint8Array(e.target.result)}).promise;
          var text='';
          for(var p=1;p<=Math.min(pdf.numPages,30);p++){
            var page=await pdf.getPage(p);
            var tc=await page.getTextContent();
            text+=tc.items.map(function(it){return it.str;}).join(' ')+'\n';
          }
          var trimmedTxt=text.trim();
          if(trimmedTxt.length<20){
            res({name:file.name,size:file.size,ext:'pdf',text:'[PDF-д цахим текст давхарга алга байна — скан хийсэн зурган баримт байж магадгүй. Хөтөч зурган PDF-ээс текст уншиж чадахгүй тул "Автоматаар задлах" болон "AI-гаар задлах" аль ч арга ажиллахгүй. Word/текст хувилбараар оруулна уу, эсвэл гараар нэмнэ үү.]'});
          } else {
            res({name:file.name,size:file.size,ext:'pdf',text:trimmedTxt});
          }
        }catch(e){res({name:file.name,size:file.size,ext:'pdf',text:'[PDF уншиж чадсангүй: '+e.message+']'});}
      };
      reader.readAsArrayBuffer(file);
    });
  }
  if(ext==='docx'){
    return new Promise(res=>{
      const r=new FileReader();
      r.onload=async e=>{
        try{
          const result=await mammoth.extractRawText({arrayBuffer:e.target.result});
          res({name:file.name,size:file.size,ext:'docx',text:result.value});
        }catch{res({name:file.name,size:file.size,ext:'docx',text:'[Word файл уншиж чадсангүй]'});}
      };
      r.readAsArrayBuffer(file);
    });
  }

  if(ext==='xlsx'||ext==='xls'||ext==='csv'){
    return new Promise(res=>{
      const r=new FileReader();
      r.onload=e=>{
        try{
          const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
          let text='';
          wb.SheetNames.forEach(sn=>{
            const ws=wb.Sheets[sn];
            // Get range
            const range=XLSX.utils.decode_range(ws['!ref']||'A1');
            const rows=[];
            for(let R=range.s.r;R<=range.e.r;R++){
              const row=[];
              for(let C=range.s.c;C<=range.e.c;C++){
                const cell=ws[XLSX.utils.encode_cell({r:R,c:C})];
                row.push(cell?String(cell.v):'');
              }
              // Skip completely empty rows
              if(row.some(v=>v.trim()))rows.push(row.join('	'));
            }
            if(wb.SheetNames.length>1)text+='=== Хуудас: '+sn+' ===\n';
            text+=rows.join('\n')+'\n\n';
          });
          res({name:file.name,size:file.size,ext:ext,text:text.trim(),sheetCount:wb.SheetNames.length});
        }catch(err){
          res({name:file.name,size:file.size,ext:ext,text:'[Excel файл уншиж чадсангүй: '+err.message+']'});
        }
      };
      r.readAsArrayBuffer(file);
    });
  }

  return{name:file.name,size:file.size,ext:ext,text:'['+ext.toUpperCase()+' файл — дэмжигдэхгүй төрөл]'};
}

async function handleFileSelect(input){
  const files=Array.from(input.files);
  const status=document.getElementById('file-status');
  S.pendingFiles=S.pendingFiles||[];
  const existingNames=S.pendingFiles.map(f=>f.name);
  let skipped=0;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    if(existingNames.indexOf(f.name)!==-1){skipped++;continue;}
    if(status)status.textContent='Уншиж байна... ('+(i+1)+'/'+files.length+')';
    const result=await readOneFile(f);
    S.pendingFiles.push(result);
    existingNames.push(f.name);
    renderPendingFiles();
  }
  input.value='';
  if(status)status.textContent=skipped?('Дууслаа ('+skipped+' давхардсан файл алгассан)'):'';
  if(status&&status.textContent)setTimeout(()=>{if(status)status.textContent='';},2500);
}

function renderPendingFiles(){
  const el=document.getElementById('pending-files');
  if(!el)return;
  if(S.pendingFiles.length===0){el.innerHTML='';return;}
  el.innerHTML=S.pendingFiles.map((f,i)=>`

      <button class="fi-rm" onclick="S.pendingFiles.splice(${i},1);renderPendingFiles()">✕</button>
    </div>`).join('');
}

// Зөвхөн тухайн бичгийг "Нэгтгэгч"-ээр тэмдэглэсэн хүн эсвэл Админ энд орж болно (canEditDocByConsolidator).
async function addFilesToLetter(letterId,inputEl){
  var letter=findLetter(letterId);
  if(!letter||!canEditDocByConsolidator(letter.consolidatorId)){showToast('Танд файл нэмэх эрх алга','#fb7185');return;}
  var files=Array.from((inputEl&&inputEl.files)||[]);
  if(!files.length)return;
  showToast(files.length+' файл боловсруулж байна...','#a78bfa');
  letter.files=letter.files||[];
  for(var i=0;i<files.length;i++){
    try{ letter.files.push(await readOneFile(files[i])); }catch(e){}
  }
  if(inputEl)inputEl.value='';
  saveData();
  showToast('Файл нэмэгдлээ ✓','#059669');
  render();
}
function removeFileFromLetter(letterId,fileIdx){
  var letter=findLetter(letterId);
  if(!letter||!canEditDocByConsolidator(letter.consolidatorId)){showToast('Танд файл устгах эрх алга','#fb7185');return;}
  if(!letter.files||!letter.files[fileIdx])return;
  if(!confirm('"'+letter.files[fileIdx].name+'" файлыг устгах уу?'))return;
  letter.files.splice(fileIdx,1);
  saveData();
  showToast('Файл устгагдлаа','#5f7292');
  render();
}

async function analyzeDoc(itemId,tabKey){
  var item=(S.data[tabKey]||[]).find(function(i){return i.id===itemId;});
  if(!item)return;
  var key=getApiKey();
  if(!key){openSettings();return;}
  var files=item.files||[];
  if(!files.length){showToast('Файл хавсаргаагүй байна','#fbbf24');return;}
  var fileTexts='';
  for(var fi=0;fi<files.length;fi++){fileTexts+='=== '+files[fi].name+' ===\n'+files[fi].text+'\n\n';}
  var isLetter=(tabKey==='letters_in');
  var isReport=(tabKey==='reports');
  var hasExcel=files.some(function(f){return ['xlsx','xls','csv'].indexOf(f.ext||'')>=0;});
  var hasTemplate=files.some(function(f){return f.ext==='docx';});

var _colResize=null;
function startColResize(ev,letterId,key){
  ev.preventDefault(); ev.stopPropagation();
  var th=ev.target.closest('th');
  if(!th)return;
  var table=th.closest('table');
  var startW=th.getBoundingClientRect().width;
  var startTableW=table?table.getBoundingClientRect().width:0;
  _colResize={letterId:letterId,key:key,startX:ev.clientX,startW:startW,th:th,table:table,startTableW:startTableW,lastW:startW};
  document.addEventListener('mousemove',onColResizeMove);
  document.addEventListener('mouseup',onColResizeEnd);
  document.body.style.cursor='col-resize';
  document.body.style.userSelect='none';
}
function onColResizeMove(ev){
  if(!_colResize)return;
  var dx=ev.clientX-_colResize.startX;
  var newW=Math.max(DIST_COL_MIN_WIDTH,Math.round(_colResize.startW+dx));
  var actualDx=newW-_colResize.startW;
  _colResize.th.style.width=newW+'px';
  if(_colResize.table)_colResize.table.style.width=(_colResize.startTableW+actualDx)+'px';
  _colResize.lastW=newW;
}
function onColResizeEnd(){
  if(!_colResize)return;
  var r=_colResize;
  _colResize=null;
  document.removeEventListener('mousemove',onColResizeMove);
  document.removeEventListener('mouseup',onColResizeEnd);
  document.body.style.cursor='';
  document.body.style.userSelect='';
  var wrapEl=document.getElementById('disttbl-'+r.letterId);
  var savedScrollLeft=wrapEl?wrapEl.scrollLeft:0;
  setColWidth(r.letterId,r.key,r.lastW);
  render();
  var wrapEl2=document.getElementById('disttbl-'+r.letterId);
  if(wrapEl2)wrapEl2.scrollLeft=savedScrollLeft;
}

function distCellReadonlyText(letter,it,key){
  // Санал асуух/хянах цонхнуудад заалтын мэдээллийг зөвхөн унших (input биш) хэлбэрээр товч харуулахад
  // ашиглана — тухайн бичигт идэвхтэй байгаа баганын бүрдлийг (getColOrder) яг л distTableEditable-тай
  // адилхан харуулж, санал асуулт/хариулт хэсэгт ч мөн адил бүрэн мэдээлэл (хугацаа, хариуцагч, шалгуур
  // үзүүлэлт г.м.) харагдахын тулд.
  if(key==='text')return it.text||'';
  if(key==='criteria')return it.criteria||'';
  if(key==='dept'){
    var parts=[];
    if(it.dept)parts.push(deptDisplayName(it.dept));
    (it.extraDepts||[]).forEach(function(d){parts.push(deptDisplayName(d));});
    return parts.join(', ');
  }
  if(key==='staffId'){
    var parts2=[];
    if(it.staffId){var nm0=staffOrPositionName(it.staffId);if(nm0)parts2.push(nm0);}
    (it.extraStaff||[]).forEach(function(sid){var s=staffById(sid);if(s)parts2.push(s.name);});
    return parts2.join(', ');
  }
  if(key==='dueDate')return it.dueDate?fmtDeadline(it.dueDate):'';
  if(key==='notifyLead'){
    var optsMap={'0':'Тухайн өдөр','1':'1 өдрийн өмнө','3':'3 өдрийн өмнө','7':'7 хоногийн өмнө'};
    return optsMap[String(it.notifyLead||'0')]||'';
  }
  return (it.extra&&it.extra[key])||'';
}

function addExtraDept(letterId,iid,val){
  var letter=findLetter(letterId);if(!letter)return;
  var it=(letter.distItems||[]).find(function(x){return x.id===iid;});if(!it)return;
  val=(val||'').trim();if(!val)return;
  if(!it.extraDepts)it.extraDepts=[];
  if(it.extraDepts.indexOf(val)===-1&&it.dept!==val)it.extraDepts.push(val);
  var nED=bulkApplyToChecked(letter,iid,function(other){
    if(!other.extraDepts)other.extraDepts=[];
    if(other.extraDepts.indexOf(val)===-1&&other.dept!==val){ other.extraDepts.push(val); return true; }
    return false;
  });
  if(nED>0)showToast(nED+' чагталсан мөрөнд мөн адилхан нэмэлт хэлтэс нэмэгдлээ ✓','#059669');
  saveData();render();
}
function handleAddExtraDept(letterId,iid,selEl){
  var v=selEl.value;
  if(!v){render();return;}
  if(v==='__other__'){
    var nv=prompt('Нэмэлт хэлтэс/байгууллагын нэрийг бичнэ үү:','');
    if(nv&&nv.trim())addExtraDept(letterId,iid,nv.trim());
    else render();
    return;
  }
  addExtraDept(letterId,iid,v);
}
function removeExtraDept(letterId,iid,val){
  var letter=findLetter(letterId);if(!letter)return;
  var it=(letter.distItems||[]).find(function(x){return x.id===iid;});if(!it)return;
  it.extraDepts=(it.extraDepts||[]).filter(function(x){return x!==val;});
  bulkApplyToChecked(letter,iid,function(other){
    var before=(other.extraDepts||[]).length;
    other.extraDepts=(other.extraDepts||[]).filter(function(x){return x!==val;});
    return other.extraDepts.length!==before;
  });
  saveData();render();
}
function bulkApplyToChecked(letter,iid,applyFn){
  var sel=S.clauseSel||{};
  if(!sel[iid])return 0;
  var checkedIds=Object.keys(sel).filter(function(k){return sel[k];});
  if(checkedIds.length<2)return 0;
  var count=0;
  checkedIds.forEach(function(cid){
    if(cid===iid)return;
    var other=(letter.distItems||[]).find(function(x){return x.id===cid;});
    if(other&&!other.isHeader){
      var applied=applyFn(other);
      if(applied!==false)count++;
    }
  });
  return count;
}
function setDueDateMode(letterId,iid,type){
  var letter=findLetter(letterId);if(!letter)return;
  var it=(letter.distItems||[]).find(function(x){return x.id===iid;});if(!it)return;
  if(!type){
    it.recurPattern=null; it.recurring=false;
  } else if(type==='adhoc'){
    // "Тухай бүр" — тогтмол давтагдах мөчлөгтэй биш (сар/улирал бүр гэх мэт тогтсон хугацаагүй), зөвхөн
    // "тухайн үед хариу өгнө" гэдгийг тэмдэглэсэн төлөв тул recurring=false үлдээнэ (мөчлөгийн тооллого,
    // "Дараагийн мөчлөг эхлүүлэх" зэрэг тогтмол-заалтын логикт орохгүй байх учиртай).
    it.recurPattern={type:'adhoc'};
    it.dueDate=recurLabel(it.recurPattern);
    it.recurring=false;
  } else {
    var prev=it.recurPattern||{};
    it.recurPattern={type:type,dayOfMonth:prev.dayOfMonth||25,dayOfWeek:prev.dayOfWeek||1,month:(prev.month!=null?prev.month:10)};
    it.dueDate=recurLabel(it.recurPattern);
    it.recurring=true;
  }
  var nDD=bulkApplyToChecked(letter,iid,function(other){
    if(!type){ other.recurPattern=null; other.recurring=false; }
    else if(type==='adhoc'){ other.recurPattern={type:'adhoc'}; other.recurring=false; }
    else { other.recurPattern={type:type,dayOfMonth:it.recurPattern.dayOfMonth,dayOfWeek:it.recurPattern.dayOfWeek,month:it.recurPattern.month}; other.recurring=true; }
    other.dueDate=it.dueDate;
  });
  if(nDD>0)showToast(nDD+' чагталсан мөрөнд хугацааны төрөл мөн адилхан тохирлоо ✓','#059669');
  saveData();render();
}
function updateRecurField(letterId,iid,field,value){
  var letter=findLetter(letterId);if(!letter)return;
  var it=(letter.distItems||[]).find(function(x){return x.id===iid;});if(!it)return;
  if(!it.recurPattern)return;
  it.recurPattern[field]=value;
  it.dueDate=recurLabel(it.recurPattern);
  var nRF=bulkApplyToChecked(letter,iid,function(other){
    if(!other.recurPattern||other.recurPattern.type!==it.recurPattern.type)return false;
    other.recurPattern[field]=value;
    other.dueDate=recurLabel(other.recurPattern);
  });
  if(nRF>0)showToast(nRF+' чагталсан мөрөнд хугацаа мөн адилхан тохирлоо ✓','#059669');
  saveData();render();
}

function distTableEditable(letter){
  var its=letter.distItems||[];
  var sel=S.clauseSel||{};
  var order=getColOrder(letter);
  if(its.length===0)return '<p style="font-size:12px;color:#5f7292">Одоогоор заалт алга.</p>';
  var seq=0;
  var totalCols=order.length+2;
  var rows=its.map(function(it,idx){
    var moveBtns='<button onclick="moveDistItem(\''+letter.id+'\',\''+it.id+'\',-1)" '+(idx===0?'disabled':'')+' style="border:none;background:none;cursor:pointer;color:#5f7292;padding:1px" title="Дээш зөөх">▲</button><button onclick="moveDistItem(\''+letter.id+'\',\''+it.id+'\',1)" '+(idx===its.length-1?'disabled':'')+' style="border:none;background:none;cursor:pointer;color:#5f7292;padding:1px" title="Доош зөөх">▼</button>';
    if(it.isHeader){
      return '<tr style="background:#111e35'+(sel[it.id]?';outline:1px solid #0891b2':'')+'">'
        +'<td style="padding:8px 4px;vertical-align:top;text-align:center"><input type="checkbox" '+(sel[it.id]?'checked':'')+' onchange="toggleClauseSel(\''+it.id+'\')"></td>'
        +'<td colspan="'+totalCols+'" style="padding:8px 4px"><div style="display:flex;gap:6px;align-items:center"><div style="display:flex;flex-direction:column">'+moveBtns+'</div><input value="'+esc(it.text||'')+'" placeholder="Бүлэг/гарчгийн нэр (жиш: 1. Шийдвэр гүйцэтгэх ажиллагааны чанаржилт)" style="flex:1;font-size:13px;font-weight:600;border:.5px solid #26395a;border-radius:6px;padding:6px 8px;background:transparent;color:#E7EDF7" onchange="updateDistItem(\''+letter.id+'\',\''+it.id+'\',\'text\',this.value)">'
        +'<button class="btn-del" onclick="removeDistItem(\''+letter.id+'\',\''+it.id+'\')"><i class="ti ti-trash"></i></button></div></td>'
        +'</tr>';
    }
    var isContinuation=!!it.groupId&&idx>0&&its[idx-1].groupId===it.groupId&&!its[idx-1].isHeader;
    if(!isContinuation)seq++;
    // Тайлбар: 2026-08 хүртэл энд rowspan ашиглаж багана нэгтгэдэг байсан ч, sticky (тогтмол/freeze) thead-тай
    // хамт rowspan эгнээ ашиглахад хэсэг браузерт (Chromium) толгой мөр болон нэгтгэсэн эсийн агуулга давхцаж,
    // "давхар" харагдах согог үүсдэг нь Playwright-аар шалгаж баталгаажлаа. Тиймээс rowspan-г бүрмөсөн хассан:
    // бүлгийн эхний мөрөнд л д/д, "Хэрэгжүүлэх ажил" бичвэрийг харуулж, дараагийн (isContinuation) мөрүүдэд
    // тэдгээр эсийг хоосон орхино — харагдах байдал бага зэрэг өөрчлөгдөх ч sticky толгой мөртэй зөрчилдөхгүй.
    var numCell=isContinuation?'<td style="padding:6px 4px"></td>':'<td style="padding:6px 4px;color:#5f7292;vertical-align:top;font-size:12px">'+seq+'</td>';
    var cellsHtml=order.map(function(k){
      if(k==='text'){
        if(isContinuation)return '<td style="padding:6px 4px"></td>';
        return distCellHtml(letter,it,k);
      }
      return distCellHtml(letter,it,k);
    }).join('');
    return '<tr style="border-bottom:.5px solid #16213a'+(sel[it.id]?';background:#0d2633':'')+(isContinuation?';border-top:none':'')+'">'
      +'<td style="padding:6px 4px;vertical-align:top;text-align:center"><input type="checkbox" '+(sel[it.id]?'checked':'')+' onchange="toggleClauseSel(\''+it.id+'\')"></td>'
      +numCell
      +cellsHtml
      +'<td style="padding:6px 4px;vertical-align:top;text-align:center"><div style="display:flex;align-items:center;justify-content:center;gap:2px">'+moveBtns+'<button class="btn-del" onclick="removeDistItem(\''+letter.id+'\',\''+it.id+'\')"><i class="ti ti-trash"></i></button></div></td>'
      +'</tr>';
  }).join('');
  var FIXED_COL_W={sel:32,num:34,act:64};
  var totalTableW=FIXED_COL_W.sel+FIXED_COL_W.num+FIXED_COL_W.act+order.reduce(function(a,k){return a+getColWidth(letter,k);},0);
  var theadStickyBase='position:sticky;top:0;z-index:15;background:#0d1526;box-shadow:0 1px 0 #26395a';
  var theadCells=order.map(function(k){
    var w=getColWidth(letter,k);
    var handle='<span onmousedown="startColResize(event,'+jsq(letter.id)+','+jsq(k)+')" title="Чирж багана өргөнийг тохируулах" style="position:absolute;top:0;right:-3px;bottom:0;width:7px;cursor:col-resize;z-index:5"></span>';
    return '<th style="padding:6px 4px;width:'+w+'px;white-space:normal;'+theadStickyBase+'">'+esc(distColLabel(k))+handle+'</th>';
  }).join('');
  // Хүснэгтэд тодорхой нийт өргөн (баганын өргөнүүдийн нийлбэр) өгснөөр table-layout:fixed баганы жинхэнэ хэмжээгээр (агуулагч хайрцгийн өргөнд шахагдалгүй) харагдаж,
  // багтахгүй бол багана нэмэгдэх тусам хажуу тийш нь (#disttbl-... хайрцгийн overflow-x:auto-ээр) гүйлгэж болно.
  // Толгой мөр (thead) болон дээд удирдлагын мөр (bar1) хоёулаа sticky тул удаан доош гүйлгэсэн ч Excel-ийн "freeze panes" мэт үргэлж дэлгэц дээр харагдаж, "Мөр нэмэх" гэх мэт товчлуурт хүрэхийн тулд дээш буцаж гүйлгэх шаардлагагүй болно.
  return distSelToolbar(letter)+'<div id="disttbl-'+letter.id+'" style="overflow:auto;max-height:64vh;border-radius:8px"><table style="border-collapse:collapse;font-size:13px;table-layout:fixed;width:'+totalTableW+'px">'
    +'<thead><tr style="text-align:left;color:#8aaace;font-size:11px">'
    +'<th style="padding:6px 4px;width:'+FIXED_COL_W.sel+'px;'+theadStickyBase+'">​</th><th style="padding:6px 4px;width:'+FIXED_COL_W.num+'px;'+theadStickyBase+'">№</th>'+theadCells+'<th style="padding:6px 4px;width:'+FIXED_COL_W.act+'px;'+theadStickyBase+'">​</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function addDistSectionHeader(letterId){
  var letter=findLetter(letterId); if(!letter)return;

  letter.distItems.push({id:genId(),isHeader:true,text:'',criteria:'',dept:'',staffId:'',extraStaff:[],dueDate:'',notifyLead:'0',extra:{},recurring:false,done:false,doneDate:'',fulfillment:''});
  S.distOpen[letterId]=true;
  saveData();render();
}
function updateDistItemExtra(letterId,iid,colName,value){
  var letter=findLetter(letterId);if(!letter)return;
  var it=(letter.distItems||[]).find(function(x){return x.id===iid;});if(!it)return;
  if(!it.extra)it.extra={};
  it.extra[colName]=value;
  saveData();render();
}
function addExtraColumn(letterId,colName){
  var letter=findLetter(letterId);if(!letter)return;
  colName=(colName||'').trim(); if(!colName)return;
  if(BASE_COL_DEFS.hasOwnProperty(colName)){showToast('Энэ нэртэй суурь багана аль хэдийн байна','#fbbf24');return;}
  var order=getColOrder(letter);
  if(order.indexOf(colName)===-1)order.push(colName);
  saveData();render();
}
function removeExtraColumn(letterId,colName){
  // Тайлбар: анх зөвхөн хэрэглэгчийн нэмсэн ("нэмэлт") баганыг л устгах боломжтой байсан, суурь баганууд
  // (Хэрэгжүүлэх ажил, Хугацаа гэх мэт) устгах боломжгүй байв. Хэрэглэгчид бичгийн төрлөөс хамааран (жишээ нь
  // "Төсөл" дээр зөвхөн "Хэрэгжүүлэх ажил" + өөрийн нэмсэн "Санал" баганатай байвал хангалттай гэх мэт)
  // баганаа бүрэн эрх чөлөөтэй зохион байгуулах хэрэгцээ гарсан тул одоо СУУРЬ баганыг ч мөн устгаж болно —
  // гагцхүү хамгийн багадаа 1 багана үлдэх ёстой (бүх баганаа устгавал хүснэгт утгагүй болно).
  var letter=findLetter(letterId);if(!letter)return;
  var order=getColOrder(letter);
  if(order.length<=1){showToast('Хамгийн багадаа 1 багана байх ёстой','#fbbf24');return;}
  letter.colOrder=order.filter(function(c){return c!==colName;});
  saveData();render();
}
function moveColumn(letterId,key,dir){
  var letter=findLetter(letterId);if(!letter)return;
  var order=getColOrder(letter);
  var idx=order.indexOf(key); if(idx<0)return;
  var newIdx=idx+dir; if(newIdx<0||newIdx>=order.length)return;
  var tmp=order[idx];order[idx]=order[newIdx];order[newIdx]=tmp;
  saveData();render();
}
function assignCheckedClauses(letterId){
  var letter=findLetter(letterId);if(!letter)return;
  var sel=S.clauseSel||{};
  var b=S.bulkAssign||{};
  if(!b.dept){showToast('Эхлээд хэлтэс сонгоно уу','#fbbf24');return;}
  var checkedItems=(letter.distItems||[]).filter(function(it){return sel[it.id];});
  if(checkedItems.length===0){showToast('Мөр чагтлагдаагүй байна','#fbbf24');return;}
  checkedItems.forEach(function(it){ it.dept=b.dept; it.staffId=b.staffId||''; });
  saveData();showToast(checkedItems.length+' мөрд оноогдлоо ✓','#059669');render();
}
function moveDistItem(letterId,itemId,dir){
  var letter=findLetter(letterId);if(!letter)return;
  var arr=letter.distItems||[];
  var idx=arr.findIndex(function(x){return x.id===itemId;}); if(idx<0)return;
  var newIdx=idx+dir; if(newIdx<0||newIdx>=arr.length)return;
  var tmp=arr[idx];arr[idx]=arr[newIdx];arr[newIdx]=tmp;
  saveData();render();
}
function toggleClauseSel(id){ S.clauseSel=S.clauseSel||{}; S.clauseSel[id]=!S.clauseSel[id]; render(); }
function selectAllClauses(letterId,val){
  var letter=findLetter(letterId); if(!letter)return;
  S.clauseSel=S.clauseSel||{};
  (letter.distItems||[]).forEach(function(it){ S.clauseSel[it.id]=val; });
  render();
}
function deleteCheckedClauses(letterId){
  var letter=findLetter(letterId); if(!letter)return;
  var sel=S.clauseSel||{};
  var before=(letter.distItems||[]).length;
  letter.distItems=(letter.distItems||[]).filter(function(it){ var keep=!sel[it.id]; if(!keep)delete sel[it.id]; return keep; });
  var removed=before-letter.distItems.length;
  if(removed===0){showToast('Устгах мөр чагтлагдаагүй байна','#fbbf24');return;}
  saveData();showToast(removed+' мөр устгагдлаа ✓','#059669');render();
}
function mergeCheckedClauses(letterId){
  var letter=findLetter(letterId); if(!letter)return;
  var sel=S.clauseSel||{};
  var its=letter.distItems||[];
  var checkedItems=its.filter(function(it){return sel[it.id];});
  if(checkedItems.length<2){showToast('Нэгтгэхийн тулд дор хаяж 2 мөр чагтлана уу','#fbbf24');return;}
  var mergedText=checkedItems.map(function(it){return (it.text||'').trim();}).filter(Boolean).join(' ');
  var keepId=checkedItems[0].id;
  checkedItems[0].text=mergedText.slice(0,1500);
  checkedItems.forEach(function(it){ delete sel[it.id]; });
  letter.distItems=its.filter(function(it){ return it.id===keepId || checkedItems.indexOf(it)===-1; });
  saveData();showToast('Сонгосон мөрүүд нэг заалт болж нэгтгэгдлээ ✓','#059669');render();
}

  // "Ирсэн бичиг" таб дээр л харагддаг тул тухайн таб руу түр шилжинэ, хаахад буцаад анхны таб руугаа очно.

function wizardStepsHtml(cur,letter){
  // Заалт болгож задлаагүй ("зөвхөн файл дээр санал асуух") бичигт "Хэлтэст хуваарилах" алхам хэрэггүй тул
  // алхмын жагсаалтаас хасна — тэгэхгүй бол хэрэглэгч ашиглагдахгүй алхам руу орох ёстой юм шиг ойлгогддог.
  var noClauses=letter&&!(letter.distItems&&letter.distItems.filter(function(it){return !it.isHeader;}).length);
  var steps=[{k:'reg',lbl:'Бичиг бүртгэх'},{k:'ai',lbl:'AI ангилах, задлах'},{k:'opinion',lbl:'Санал авах'}];
  if(!noClauses||cur==='assign')steps.push({k:'assign',lbl:'Хэлтэст хуваарилах'});
  var curIdx=steps.findIndex(function(s){return s.k===cur;});
  return '<div class="wiz-steps">'+steps.map(function(s,i){
    var cls=i<curIdx?'done':(i===curIdx?'active':'');
    var clickable=i<=curIdx&&i>0; // "Бичиг бүртгэх" already done, not re-clickable
    return '<div class="wiz-step '+cls+'"'+(clickable?' onclick="wizardGoStep(\''+s.k+'\')"':'')+'><div class="wiz-dot">'+(i<curIdx?'✓':(i+1))+'</div><div class="wiz-lbl">'+s.lbl+'</div></div>';
  }).join('')+'</div>';
}

function isDiagText(t){ return /^\[.*\]$/.test((t||'').trim()); }
function splitByMarkers(text,re){
  var matches=[];var m;
  while((m=re.exec(text))){matches.push(m.index);}
  if(matches.length<2)return null;
  var parts=[];
  for(var i=0;i<matches.length;i++){
    var start=matches[i];
    var end=(i+1<matches.length)?matches[i+1]:text.length;
    var chunk=text.slice(start,end).trim();
    if(chunk)parts.push(chunk);
  }
  return parts;
}
function splitClauseCandidates(fileObj){
  var text=(fileObj.text||'').replace(/\r\n/g,'\n');
  if(!text.trim())return [];
  if(isDiagText(text))return [];
  if(['xlsx','xls','csv'].indexOf(fileObj.ext)!==-1){
    var lines=text.split('\n').map(function(l){return l.trim();}).filter(function(l){return l&&l.indexOf('=== Хуудас:')!==0;});
    if(lines.length<2)return lines;
    // эхний мөрийг гарчиг гэж үзэж алгасна, үлдсэн мөр бүрийг нэг заалт болгоно
    return lines.slice(1).filter(function(l){return l.replace(/\t/g,'').trim().length>0;}).slice(0,300);
  }
  // 1) дугаарласан жагсаалт (1. 2. 3. / 1) 2) 3) / №1 №2 гэх мэт) мөрийн эхэнд байгаа хэв маягийг танина
  var reNum=/^[ \t]*(?:№[ \t]*)?(\d{1,3})[\.\)][ \t]+/gm;
  var matches=[];var m;
  while((m=reNum.exec(text))){matches.push({idx:m.index,num:parseInt(m[1],10)});}
  var seq=[];var last=0;
  matches.forEach(function(mm){ if(mm.num>=last&&(mm.idx===0||mm.num>last||seq.length===0)){seq.push(mm);last=Math.max(last,mm.num);} });
  if(seq.length>=2){
    var parts=[];
    for(var i=0;i<seq.length;i++){
      var start=seq[i].idx;
      var end=(i+1<seq.length)?seq[i+1].idx:text.length;
      var chunk=text.slice(start,end).trim();
      if(chunk)parts.push(chunk);
    }
    return parts;
  }
  // 2) мөрийн эхэнд байгаа зураас/цэгэн жагсаалт (-, •, ●, ▪)
  var reDash=/^[ \t]*[-•●▪][ \t]+/gm;
  var dashParts=splitByMarkers(text,reDash);
  if(dashParts&&dashParts.length>=2)return dashParts.slice(0,80);
  // 3) мөрийн дундуур байгаа дугаарласан жагсаалт (PDF задлахад мөр таслагдаагүй, зайгаар холбогдсон тохиолдол)
  var reInline=/(?:^|[ \t])(\d{1,3})[\.\)][ \t]+(?=[А-ЯӨҮA-Z])/gm;
  var inlineMatches=[];var mi;
  while((mi=reInline.exec(text))){inlineMatches.push({idx:mi.index,num:parseInt(mi[1],10)});}
  var seq2=[];var last2=0;
  inlineMatches.forEach(function(mm){ if(mm.num>last2){seq2.push(mm);last2=mm.num;} });
  if(seq2.length>=3){
    var parts2=[];
    for(var j=0;j<seq2.length;j++){
      var s2=seq2[j].idx;
      var e2=(j+1<seq2.length)?seq2[j+1].idx:text.length;
      var chunk2=text.slice(s2,e2).trim();
      if(chunk2)parts2.push(chunk2);
    }
    return parts2;
  }
  // 4) хоосон мөрөөр тусгаарлагдсан догол мөр бүрийг заалт гэж үзнэ
  var paras=text.split(/\n\s*\n/).map(function(p){return p.trim();}).filter(function(p){return p.length>15;});
  if(paras.length>=2)return paras.slice(0,50);
  // 5) сүүлчийн эргэлт — бүх текстийг нэг заалт болгож харуулна, ингэснээр хэрэглэгч дор хаяж агуулгыг харж гараар засах боломжтой болно
  return text.trim()?[text.trim()]:[];
}
function autoSplitLetter(letterId){
  var letter=findLetter(letterId); if(!letter)return;
  var files=letter.files||[];
  if(!files.length){showToast('Файл хавсаргаагүй байна — гараар заалт нэмнэ үү','#fbbf24');return;}
  var diagFile=files.find(function(f){return isDiagText(f.text);});
  var candidates=[];
  files.forEach(function(f){ if(!isDiagText(f.text)) candidates=candidates.concat(splitClauseCandidates(f)); });
  candidates=candidates.map(function(c){return c.trim();}).filter(function(c){return c.length>3;});
  if(candidates.length===0){
    if(diagFile){ showToast(diagFile.text.replace(/^\[|\]$/g,''),'#fb7185'); }
    else{ showToast('Заалт таньж чадсангүй — гараар нэмнэ үү эсвэл AI ашиглана уу','#fbbf24'); }
    return;
  }
  if(!letter.distItems)letter.distItems=[];
  candidates.forEach(function(c){
    letter.distItems.push({id:genId(),text:c.slice(0,600),criteria:'',baseline:'',target:'',groupId:'',dept:'',staffId:'',extraStaff:[],dueDate:'',notifyLead:'0',recurring:false,done:false,doneDate:'',fulfillment:''});
  });
  S.distOpen[letterId]=true;
  saveData();showToast(candidates.length+' заалт файлаас автоматаар танигдлаа ✓ Шалгаад засна уу.','#059669');render();
}

function getWorkItemArray(source,letterId){
  if(source==='legacy') return S.data.legacyItems||(S.data.legacyItems=[]);
  var letter=findLetter(letterId); if(!letter)return null;
  if(!letter.distItems)letter.distItems=[];
  return letter.distItems;
}
function updateWorkItem(source,letterId,iid,field,value){
  var arr=getWorkItemArray(source,letterId); if(!arr)return;
  var it=arr.find(function(x){return x.id===iid;}); if(!it)return;
  it[field]=value;
  if(field==='done')it.doneDate=value?(it.doneDate||todayStr()):'';
  saveData(); render();
}
function addExtraStaff(source,letterId,iid,staffIdStr){
  var arr=getWorkItemArray(source,letterId); if(!arr)return;
  var it=arr.find(function(x){return x.id===iid;}); if(!it)return;
  var sid=parseInt(staffIdStr); if(!sid)return;
  if(!it.extraStaff)it.extraStaff=[];
  if(it.extraStaff.indexOf(sid)===-1&&it.staffId!==sid)it.extraStaff.push(sid);
  if(source==='letter'){
    var letterES=findLetter(letterId);
    if(letterES){
      var nES=bulkApplyToChecked(letterES,iid,function(other){
        if(!other.extraStaff)other.extraStaff=[];
        if(other.extraStaff.indexOf(sid)===-1&&other.staffId!==sid){ other.extraStaff.push(sid); return true; }
        return false;
      });
      if(nES>0)showToast(nES+' чагталсан мөрөнд мөн адилхан нэмэлт алба хаагч нэмэгдлээ ✓','#059669');
    }
  }
  saveData(); render();
}
function removeExtraStaff(source,letterId,iid,staffId){
  var arr=getWorkItemArray(source,letterId); if(!arr)return;
  var it=arr.find(function(x){return x.id===iid;}); if(!it)return;
  it.extraStaff=(it.extraStaff||[]).filter(function(x){return x!==staffId;});
  if(source==='letter'){
    var letterRS=findLetter(letterId);
    if(letterRS){
      bulkApplyToChecked(letterRS,iid,function(other){
        var before=(other.extraStaff||[]).length;
        other.extraStaff=(other.extraStaff||[]).filter(function(x){return x!==staffId;});
        return other.extraStaff.length!==before;
      });
    }
  }
  saveData(); render();
}
// ── ЗААЛТ (д/д) ТООЛОХ — ижил groupId-тай мөрүүд НЭГ Л заалт, олон ШАЛГУУР ҮЗҮҮЛЭЛТ гэж тоологдоно ──
function countDistinctClauses(items){
  var seen={},count=0;
  (items||[]).forEach(function(it){
    if(it.isHeader)return;
    if(!it.groupId){count++;return;}
    if(!seen[it.groupId]){seen[it.groupId]=true;count++;}
  });
  return count;
}
function getAllWorkItems(){
  var out=[];
  (S.data.letters_in||[]).forEach(function(l){

    (l.distItems||[]).forEach(function(it){
      if(it.isHeader)return; // гарчиг/бүлэг мөр нь бодит ажил/заалт биш — статистик, хяналт, хуваарилалтын тооллогод огт орохгүй
      var c={}; for(var k in it)c[k]=it[k];
      c._source='letter'; c._letterId=l.id; c._label=l.subject||l.number||'Ирсэн бичиг';
      c._from=l.from||''; c._docType=l.docType||''; c._hasFiles=!!(l.files&&l.files.length);

    out.push(c);
  });
  return out;
}

function getMetaList(){
  var mo=S.data.metaOverrides||{}, co=S.data.catNameOverrides||{};
  var removed=S.data.removedDocNums||[];
  var builtin=PLAN_META.filter(function(m){return removed.indexOf(m.num)===-1;}).map(function(m){
    var o=mo[m.num]||{};
    return {num:m.num,sheet:o.sheet||m.sheet,short:o.short||m.short,cat:co[m.cat]||m.cat,_origCat:m.cat,color:m.color,count:m.count,term:m.term||'',subGroup:o.subGroup||'',_custom:false};
  });
  var custom=(S.data.customDocs||[]).map(function(m){
    return {num:m.num,sheet:m.sheet,short:m.short,cat:co[m.cat]||m.cat,_origCat:m.cat,color:m.color||'7c5cff',count:0,term:m.term||'',subGroup:m.subGroup||'',_custom:true};
  });
  var letterDocs=(S.data.letters_in||[]).filter(function(l){return l.groupCat;}).map(function(l){
    return {num:'letter_'+l.id,sheet:l.subject||l.number||'Ирсэн бичиг',short:l.docType||'',cat:co[l.groupCat]||l.groupCat,_origCat:l.groupCat,color:'0EA5E9',count:0,term:'',subGroup:l.subGroup||'',_custom:false,_letter:true,_letterId:l.id,date:l.date||''};
  });
  return builtin.concat(custom).concat(letterDocs);
}
// Тайлбар: "Дэд бүлэг" ерөнхий тогтолцоо — өмнө нь зөвхөн хатуу кодлогдсон "term" (long/medium →
// "Урт хугацааны"/"Дунд хугацааны") ашигладаг байсан ч, энэ нь зөвхөн урьдчилан ачаалагдсан 228 заалтын
// баримт бичигт л ажилладаг, Ирсэн бичгээр шинээр орж ирэх бичиг огт term авдаггүй (үргэлж '') байсан тул
// тухайн бүлэгт "хугацааны" карт гарч ирмэгц шинэ бичиг АЛГА БОЛДОГ (харагдахгүй болдог) согогтой байсан.
// Одоо term хэвээрээ ажилладаг (ялангуяа Урт/Дунд хугацааны 2 тогтмол нэрийг хадгалж), гэхдээ үүнээс гадна
// дурын нэртэй "Дэд бүлэг" (subGroup чөлөөт текст)-ийг term-гүй баримт бичиг, Ирсэн бичгийн аль алинд нь
// зааж өгч болно. effectiveSubGroup() нь аль нэгийг нь (term-г түрүүлж) буцаана, term/subGroup хоёулаа
// хоосон бол '' буцааж — тэр тохиолдолд тухайн баримт бичиг "Бусад" сагсанд ордог (алга болохгүй).
function effectiveSubGroup(m){
  if(!m)return '';
  if(m.term==='long')return 'Урт хугацааны';
  if(m.term==='medium')return 'Дунд хугацааны';
  return (m.subGroup||'').trim();
}
function subGroupSortCompare(a,b){
  // "Урт хугацааны..."/"Дунд хугацааны..." гэж эхэлдэг АЛЬ Ч нэртэй (жиш: "Урт хугацааны бодлогын
  // баримт бичиг") дэд бүлгийг таньж, тэдгээрийг эхэнд нь дараалуулна — зөвхөн яг үгчилж таарсан
  // ("Урт хугацааны" гэдэг ганцхан үгтэй тэнцүү) тохиолдолд ажилладаг байснаас болж урт нэртэй
  // дэд бүлгүүд цагаан толгойн дараалалд орчихдог байсныг засав.
  var pre=['Урт хугацааны','Дунд хугацааны'];
  function prio(s){
    for(var i=0;i<pre.length;i++){ if(s.indexOf(pre[i])===0)return i; }
    return pre.length;
  }
  var oa=prio(a), ob=prio(b);
  if(oa!==ob)return oa-ob;
  return a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'});
}
function allSubGroupLabels(){
  var set={};
  getMetaList().forEach(function(m){var l=effectiveSubGroup(m);if(l)set[l]=true;});
  return Object.keys(set).sort(subGroupSortCompare);
}
// Хэрэглэгч Нүүр хуудасны дэд бүлгийн картуудыг гараар дээш/доош зөөж, өөрийн дуртай дарааллаар
// байрлуулах боломж (S.data.subGroupOrder[origCat] = [дэд бүлгийн нэрс, дарааллаар]). Хадгалагдсан
// дараалал байхгүй бол дээрх subGroupSortCompare-ийн анхны (Урт→Дунд→бусад цагаан толгойн) дарааллаар эхэлнэ.
function ensureSubGroupOrderComplete(origCat,labels){
  if(!S.data.subGroupOrder)S.data.subGroupOrder={};
  var order=S.data.subGroupOrder[origCat];
  if(!order||!order.length){ order=labels.slice().sort(subGroupSortCompare); }
  else { order=order.slice(); }
  labels.forEach(function(l){ if(order.indexOf(l)===-1)order.push(l); });
  order=order.filter(function(l){ return labels.indexOf(l)!==-1; });
  S.data.subGroupOrder[origCat]=order;
  return order;
}
function sortedSubLabelsForGroup(g){
  var labels=Array.from(new Set(g.docs.map(effectiveSubGroup).filter(Boolean)));
  return ensureSubGroupOrderComplete(g.origCat,labels).slice();
}
function moveSubGroupUp(origCat,label){
  var groups=getCatGroups(), g=groups.find(function(x){return x.origCat===origCat;});
  if(!g)return;
  var labels=Array.from(new Set(g.docs.map(effectiveSubGroup).filter(Boolean)));
  var order=ensureSubGroupOrderComplete(origCat,labels);
  var idx=order.indexOf(label);
  if(idx<=0)return;
  var tmp=order[idx-1]; order[idx-1]=order[idx]; order[idx]=tmp;
  S.data.subGroupOrder[origCat]=order; saveData(); render();
}
function moveSubGroupDown(origCat,label){
  var groups=getCatGroups(), g=groups.find(function(x){return x.origCat===origCat;});
  if(!g)return;
  var labels=Array.from(new Set(g.docs.map(effectiveSubGroup).filter(Boolean)));
  var order=ensureSubGroupOrderComplete(origCat,labels);
  var idx=order.indexOf(label);
  if(idx===-1||idx>=order.length-1)return;
  var tmp=order[idx+1]; order[idx+1]=order[idx]; order[idx]=tmp;
  S.data.subGroupOrder[origCat]=order; saveData(); render();
}
function getCatGroups(){
  var list=getMetaList(), groups=[], byOrig={}, cd=S.data.catDescOverrides||{}, co=S.data.catNameOverrides||{};
  list.forEach(function(m){
    if(!byOrig[m._origCat]){ byOrig[m._origCat]={origCat:m._origCat,cat:m.cat,desc:cd[m._origCat]||'',color:m.color,docs:[]}; groups.push(byOrig[m._origCat]); }
    byOrig[m._origCat].docs.push(m);
  });
  // Админ "Шинэ бүлэг нэмэх"-ээр гараар үүсгэсэн, одоогоор дотор нь ямар ч баримт бичиггүй хоосон бүлгүүд —
  // дараа нь ямар нэг Ирсэн бичиг эсвэл каталогийн бичиг энэ бүлгийг сонговол дээрх мөчлөгт орж, энд байхаа болино.
  (S.data.customGroups||[]).forEach(function(g){
    if(!byOrig[g.key]){
      byOrig[g.key]={origCat:g.key,cat:co[g.key]||g.key,desc:cd[g.key]||'',color:g.color||'7c5cff',docs:[]};
      groups.push(byOrig[g.key]);
    }
  });
  // Админ өөрчилж болдог дараалал (S.data.catOrder) байвал түүгээр эрэмбэлнэ; жагсаалтад ороогүй бүлгүүдийг
  // "2-р бүлэг" "10-р бүлэг" гэх мэт тоотой нэрсийг зөв дараалалд оруулахын тулд natural sort-оор ард нь залгана.
  var order=S.data.catOrder||DEFAULT_CAT_ORDER;
  groups.sort(function(a,b){
    var ia=order.indexOf(a.origCat), ib=order.indexOf(b.origCat);
    if(ia===-1&&ib===-1)return (a.cat||'').localeCompare(b.cat||'',undefined,{numeric:true,sensitivity:'base'});
    if(ia===-1)return 1;
    if(ib===-1)return -1;
    return ia-ib;
  });
  return groups;
}
function ensureCatOrderComplete(){
  if(!S.data.catOrder)S.data.catOrder=DEFAULT_CAT_ORDER.slice();
  var order=S.data.catOrder, groups=getCatGroups();
  groups.forEach(function(g){ if(order.indexOf(g.origCat)===-1)order.push(g.origCat); });
  return order;
}
function moveCatUp(origCat){
  var order=ensureCatOrderComplete(), idx=order.indexOf(origCat);
  if(idx<=0)return;
  var tmp=order[idx-1]; order[idx-1]=order[idx]; order[idx]=tmp;
  S.data.catOrder=order; saveData(); render();
}
function moveCatDown(origCat){
  var order=ensureCatOrderComplete(), idx=order.indexOf(origCat);
  if(idx===-1||idx>=order.length-1)return;
  var tmp=order[idx+1]; order[idx+1]=order[idx]; order[idx]=tmp;
  S.data.catOrder=order; saveData(); render();
}

function homeFilteredItemsForDoc(docKey){

function toggleHomeListGroupOpen(key){ S.homeListGroupOpen=S.homeListGroupOpen||{}; S.homeListGroupOpen[key]=!S.homeListGroupOpen[key]; render(); }
function renderHomeItemsList(){
  var items=getAllWorkItems();
  if(!S.homeShowUnassigned)items=items.filter(function(it){return it.dept;});
  if(S.staffFilter)items=items.filter(function(it){return String(it.staffId)===String(S.staffFilter);});
  if(S.homeStatusFilter==='active')items=items.filter(function(it){return !it.done;});
  else if(S.homeStatusFilter==='done')items=items.filter(function(it){return it.done;});
  if(items.length===0)return '<p style="font-size:13px;color:#5f7292">Одоогоор шүүлтэд тохирох ажил алга</p>';
  var byKey={}, order=[];
  items.forEach(function(it){
    var key=monGroupKey(it);
    if(!byKey[key]){ byKey[key]={key:key,label:it._label,from:it._from,docType:it._docType,items:[]}; order.push(byKey[key]); }
    byKey[key].items.push(it);
  });
  order.forEach(function(g){
    g.items.sort(function(a,b){
      if(!a.dueDate&&!b.dueDate)return 0;
      if(!a.dueDate)return 1; if(!b.dueDate)return -1;
      return new Date(a.dueDate)-new Date(b.dueDate);
    });
    g._done=g.items.filter(function(it){return it.done;}).length;
    g._earliestDue=g.items.find(function(it){return it.dueDate;});
  });
  // Хамгийн ойрхон эцсийн хугацаатай заалт агуулсан төлөвлөгөөг эхэнд, хугацаагүй бол ард нь харуулна.
  order.sort(function(a,b){
    var da=a._earliestDue, db=b._earliestDue;
    if(!da&&!db)return 0; if(!da)return 1; if(!db)return -1;
    return new Date(da.dueDate)-new Date(db.dueDate);
  });
  var open=S.homeListGroupOpen=S.homeListGroupOpen||{};
  var groupsHtml=order.slice(0,150).map(function(g){
    var isOpen=!!open[g.key];
    var pct=g.items.length?Math.round(g._done/g.items.length*100):0;
    return '<div class="card" style="margin-bottom:8px;padding:12px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;flex-wrap:wrap;gap:8px" onclick="toggleHomeListGroupOpen('+jsq(g.key)+')">'
      +'<div style="min-width:220px;flex:1"><div style="font-weight:600;font-size:13.5px;color:#E7EDF7">'+esc(g.label||'Тодорхойгүй')+'</div>'
      +'<div style="font-size:11px;color:#8aaace;margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">'+(g.docType?docTypeBadge(g.docType):'')+(g.from?'<span>'+esc(g.from)+'</span>':'')+'</div></div>'
      +'<div style="display:flex;align-items:center;gap:10px">'
      +'<span style="font-size:12px;color:#8aaace">'+g._done+'/'+g.items.length+' ажил биелсэн</span>'
      +'<div style="width:80px;height:6px;background:#16213a;border-radius:3px;overflow:hidden;flex-shrink:0"><div style="width:'+pct+'%;height:100%;background:#2DD4BF"></div></div>'
      +'<i class="ti ti-chevron-'+(isOpen?'up':'down')+'"></i></div>'
      +'</div>'
      +(isOpen?('<div style="margin-top:10px;padding-top:10px;border-top:.5px dashed #26395a">'+g.items.map(function(it,idx){return workItemRow(it,idx+1);}).join('')+'</div>'):'')
      +'</div>';
  }).join('');
  return groupsHtml+(order.length>150?'<p style="font-size:12px;color:#5f7292;margin-top:8px">... болон бусад '+(order.length-150)+' төлөвлөгөө/бичиг</p>':'');
